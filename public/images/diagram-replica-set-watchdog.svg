<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Three-node MongoDB replica set with watchdog process on Fly.io">
  <rect width="900" height="520" fill="#0D1F14"/>
  <pattern id="g2" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1d3a22" stroke-width="0.4"/>
  </pattern>
  <rect width="900" height="520" fill="url(#g2)" opacity="0.5"/>

  <!-- Title bar -->
  <rect x="0" y="0" width="900" height="3" fill="#14B8A6"/>
  <text x="450" y="32" font-family="'Courier New', monospace" font-size="16" fill="#14B8A6" text-anchor="middle" letter-spacing="2">3-NODE REPLICA SET ARCHITECTURE</text>
  <line x1="50" y1="48" x2="850" y2="48" stroke="#1d3a22" stroke-width="1"/>

  <!-- PRIMARY NODE (center-left) -->
  <g transform="translate(120, 82)">
    <!-- Server box -->
    <rect x="0" y="0" width="180" height="230" rx="10" fill="#0f2218" stroke="#14B8A6" stroke-width="2"/>
    <!-- Status bar -->
    <rect x="0" y="0" width="180" height="30" rx="10" fill="#14B8A6" opacity="0.8"/>
    <rect x="0" y="20" width="180" height="10" fill="#14B8A6" opacity="0.8"/>
    <text x="90" y="20" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#0D1F14" text-anchor="middle">PRIMARY</text>
    <!-- Server internals decoration -->
    <rect x="20" y="42" width="140" height="8" rx="3" fill="#1d3a22"/>
    <rect x="20" y="56" width="100" height="8" rx="3" fill="#1d3a22"/>
    <rect x="20" y="70" width="120" height="8" rx="3" fill="#1d3a22"/>
    <!-- mongod label -->
    <text x="90" y="104" font-family="'Courier New', monospace" font-size="14" fill="#6b9c7a" text-anchor="middle">mongod</text>
    <text x="90" y="122" font-family="'Courier New', monospace" font-size="14" fill="#4a6a5a" text-anchor="middle">port 27017</text>
    <!-- Fly machine label -->
    <rect x="20" y="138" width="140" height="30" rx="5" fill="#0d1a12" stroke="#1d3a22" stroke-width="1"/>
    <text x="90" y="158" font-family="'Courier New', monospace" font-size="14" fill="#7B2FBE" text-anchor="middle">fly.io machine</text>
    <!-- Writes / Reads badges -->
    <rect x="16" y="182" width="66" height="24" rx="4" fill="#14B8A6" opacity="0.2" stroke="#14B8A6" stroke-width="1"/>
    <text x="49" y="199" font-family="'Courier New', monospace" font-size="14" fill="#14B8A6" text-anchor="middle">WRITES</text>
    <rect x="98" y="182" width="66" height="24" rx="4" fill="#1d4a2e" stroke="#2a6a40" stroke-width="1"/>
    <text x="131" y="199" font-family="'Courier New', monospace" font-size="14" fill="#6b9c7a" text-anchor="middle">READS</text>
  </g>

  <!-- SECONDARY 1 (center-right) -->
  <g transform="translate(380, 82)">
    <rect x="0" y="0" width="180" height="230" rx="10" fill="#0f1828" stroke="#4B5BDC" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="30" rx="10" fill="#4B5BDC" opacity="0.8"/>
    <rect x="0" y="20" width="180" height="10" fill="#4B5BDC" opacity="0.8"/>
    <text x="90" y="20" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SECONDARY 1</text>
    <rect x="20" y="42" width="140" height="8" rx="3" fill="#1a2438"/>
    <rect x="20" y="56" width="100" height="8" rx="3" fill="#1a2438"/>
    <rect x="20" y="70" width="120" height="8" rx="3" fill="#1a2438"/>
    <text x="90" y="104" font-family="'Courier New', monospace" font-size="14" fill="#6b7aaa" text-anchor="middle">mongod</text>
    <text x="90" y="122" font-family="'Courier New', monospace" font-size="14" fill="#4a5a7a" text-anchor="middle">port 27017</text>
    <rect x="20" y="138" width="140" height="30" rx="5" fill="#0d1020" stroke="#2a2a4a" stroke-width="1"/>
    <text x="90" y="158" font-family="'Courier New', monospace" font-size="14" fill="#7B2FBE" text-anchor="middle">fly.io machine</text>
    <rect x="20" y="182" width="140" height="24" rx="4" fill="#1a2438" stroke="#4B5BDC" stroke-width="1"/>
    <text x="90" y="199" font-family="'Courier New', monospace" font-size="14" fill="#93c5fd" text-anchor="middle">READS ONLY</text>
  </g>

  <!-- SECONDARY 2 (far right) -->
  <g transform="translate(640, 82)">
    <rect x="0" y="0" width="180" height="230" rx="10" fill="#0f1828" stroke="#4B5BDC" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="30" rx="10" fill="#4B5BDC" opacity="0.8"/>
    <rect x="0" y="20" width="180" height="10" fill="#4B5BDC" opacity="0.8"/>
    <text x="90" y="20" font-family="'Courier New', monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SECONDARY 2</text>
    <rect x="20" y="42" width="140" height="8" rx="3" fill="#1a2438"/>
    <rect x="20" y="56" width="100" height="8" rx="3" fill="#1a2438"/>
    <rect x="20" y="70" width="120" height="8" rx="3" fill="#1a2438"/>
    <text x="90" y="104" font-family="'Courier New', monospace" font-size="14" fill="#6b7aaa" text-anchor="middle">mongod</text>
    <text x="90" y="122" font-family="'Courier New', monospace" font-size="14" fill="#4a5a7a" text-anchor="middle">port 27017</text>
    <rect x="20" y="138" width="140" height="30" rx="5" fill="#0d1020" stroke="#2a2a4a" stroke-width="1"/>
    <text x="90" y="158" font-family="'Courier New', monospace" font-size="14" fill="#7B2FBE" text-anchor="middle">fly.io machine</text>
    <rect x="20" y="182" width="140" height="24" rx="4" fill="#1a2438" stroke="#4B5BDC" stroke-width="1"/>
    <text x="90" y="199" font-family="'Courier New', monospace" font-size="14" fill="#93c5fd" text-anchor="middle">FAILOVER</text>
  </g>

  <!-- Replication arrows: PRIMARY -> SECONDARY1 -->
  <line x1="302" y1="185" x2="378" y2="185" stroke="#14B8A6" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="376,178 384,185 376,192" fill="#14B8A6"/>
  <text x="340" y="175" font-family="'Courier New', monospace" font-size="14" fill="#14B8A6" text-anchor="middle">oplog</text>

  <!-- Arrow from Primary to Secondary2 via bottom -->
  <path d="M 300 240 C 300 270 640 270 640 240" fill="none" stroke="#4B5BDC" stroke-width="2" stroke-dasharray="6,3"/>
  <polygon points="633,232 641,241 649,232" fill="#4B5BDC"/>
  <text x="470" y="290" font-family="'Courier New', monospace" font-size="14" fill="#4B5BDC" text-anchor="middle">replication</text>

  <!-- WATCHDOG box at bottom-left -->
  <g transform="translate(50, 345)">
    <rect x="0" y="0" width="280" height="122" rx="10" fill="#1a1a0a" stroke="#D4602A" stroke-width="1.5" stroke-dasharray="6,3"/>
    <text x="140" y="24" font-family="'Courier New', monospace" font-size="16" fill="#D4602A" text-anchor="middle" letter-spacing="1">WATCHDOG PROCESS</text>
    <text x="140" y="46" font-family="'Courier New', monospace" font-size="14" fill="#8a6a3a" text-anchor="middle">runs inside each node</text>
    <rect x="15" y="56" width="250" height="26" rx="4" fill="#0d0d00" stroke="#4a4a1a" stroke-width="1"/>
    <text x="140" y="73" font-family="'Courier New', monospace" font-size="14" fill="#c4a040" text-anchor="middle">pings mongod every 30s</text>
    <text x="140" y="100" font-family="'Courier New', monospace" font-size="14" fill="#6a6a3a" text-anchor="middle">restart on failure, 60s cooldown</text>
  </g>

  <!-- Watchdog arrow up to Primary -->
  <line x1="190" y1="345" x2="210" y2="314" stroke="#D4602A" stroke-width="1.5" stroke-dasharray="4,2"/>
  <polygon points="203,314 211,306 219,316" fill="#D4602A"/>
  <text x="165" y="336" font-family="'Courier New', monospace" font-size="14" fill="#D4602A">monitors</text>

  <!-- LOG ROTATION note -->
  <g transform="translate(390, 345)">
    <rect x="0" y="0" width="280" height="100" rx="10" fill="#1a0f0a" stroke="#D4602A" stroke-width="1" opacity="0.8"/>
    <text x="140" y="24" font-family="'Courier New', monospace" font-size="16" fill="#D4602A" text-anchor="middle">LOG ROTATION</text>
    <text x="140" y="48" font-family="'Courier New', monospace" font-size="14" fill="#8a5a3a" text-anchor="middle">mongod skips log rotation</text>
    <text x="140" y="68" font-family="'Courier New', monospace" font-size="14" fill="#8a5a3a" text-anchor="middle">cron: rotate weekly, compress</text>
    <text x="140" y="88" font-family="'Courier New', monospace" font-size="14" fill="#D4602A" text-anchor="middle">unrotated log fills disk</text>
  </g>

  <!-- Bottom bar -->
  <rect x="0" y="517" width="900" height="3" fill="#14B8A6"/>
</svg>
