<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" height="440" role="img" aria-label="Automated backup, restore, and drill cycle for the self-hosted MongoDB cluster">
  <rect width="900" height="440" fill="#0D1F14"/>
  <pattern id="g4" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1d3a22" stroke-width="0.4"/>
  </pattern>
  <rect width="900" height="440" fill="url(#g4)" opacity="0.5"/>

  <rect x="0" y="0" width="900" height="3" fill="#14B8A6"/>
  <text x="450" y="32" font-family="'Courier New', monospace" font-size="16" fill="#14B8A6" text-anchor="middle" letter-spacing="2">BACKUP / RESTORE / DRILL CYCLE</text>
  <line x1="50" y1="48" x2="850" y2="48" stroke="#1d3a22" stroke-width="1"/>

  <!-- STEP 1: BACKUP -->
  <g transform="translate(60, 78)">
    <rect x="0" y="0" width="220" height="210" rx="12" fill="#0f2218" stroke="#14B8A6" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="34" rx="12" fill="#14B8A6" opacity="0.3"/>
    <rect x="0" y="22" width="220" height="12" fill="#14B8A6" opacity="0.3"/>
    <text x="110" y="22" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#14B8A6" text-anchor="middle">01 BACKUP</text>
    <!-- Icon: database with arrow out -->
    <rect x="70" y="46" width="80" height="55" rx="6" fill="#1d3a22" stroke="#14B8A6" stroke-width="1"/>
    <ellipse cx="110" cy="46" rx="40" ry="10" fill="#2a5a30" stroke="#14B8A6" stroke-width="1"/>
    <ellipse cx="110" cy="60" rx="40" ry="10" fill="#2a5a30" opacity="0.5"/>
    <line x1="110" y1="101" x2="110" y2="120" stroke="#14B8A6" stroke-width="2"/>
    <polygon points="104,117 110,128 116,117" fill="#14B8A6"/>
    <!-- Steps -->
    <text x="20" y="152" font-family="'Courier New', monospace" font-size="14" fill="#4a8a5a">mongodump to stdout</text>
    <text x="20" y="170" font-family="'Courier New', monospace" font-size="14" fill="#4a8a5a">encrypt client-side</text>
    <text x="20" y="188" font-family="'Courier New', monospace" font-size="14" fill="#4a8a5a">upload to object store</text>
    <!-- Schedule label -->
    <rect x="20" y="200" width="180" height="24" rx="5" fill="#0d2010" stroke="#1d4020" stroke-width="1"/>
    <text x="110" y="216" font-family="'Courier New', monospace" font-size="14" fill="#14B8A6" text-anchor="middle">SCHEDULED: daily cron</text>
  </g>

  <!-- Arrow 1 to 2 -->
  <g transform="translate(290, 162)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#14B8A6" stroke-width="2"/>
    <polygon points="55,8 65,15 55,22" fill="#14B8A6"/>
  </g>

  <!-- STEP 2: STORE (object storage) -->
  <g transform="translate(360, 78)">
    <rect x="0" y="0" width="180" height="210" rx="12" fill="#101428" stroke="#7B2FBE" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#7B2FBE" opacity="0.3"/>
    <rect x="0" y="22" width="180" height="12" fill="#7B2FBE" opacity="0.3"/>
    <text x="90" y="22" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#a78bfa" text-anchor="middle">02 STORE</text>
    <!-- Cloud/storage icon -->
    <rect x="30" y="46" width="120" height="60" rx="10" fill="#1a2438" stroke="#7B2FBE" stroke-width="1"/>
    <text x="90" y="72" font-family="'Courier New', monospace" font-size="14" fill="#a78bfa" text-anchor="middle">object storage</text>
    <text x="90" y="90" font-family="'Courier New', monospace" font-size="14" fill="#6b7aaa" text-anchor="middle">encrypted at rest</text>
    <!-- Properties -->
    <text x="20" y="130" font-family="'Courier New', monospace" font-size="14" fill="#6b7aaa">key: local only</text>
    <text x="20" y="150" font-family="'Courier New', monospace" font-size="14" fill="#6b7aaa">versioned retention</text>
    <text x="20" y="170" font-family="'Courier New', monospace" font-size="14" fill="#6b7aaa">separate from DB host</text>
    <rect x="20" y="182" width="140" height="24" rx="5" fill="#0d1020" stroke="#3a2a5a" stroke-width="1"/>
    <text x="90" y="198" font-family="'Courier New', monospace" font-size="14" fill="#a78bfa" text-anchor="middle">always encrypted</text>
  </g>

  <!-- Arrow 2 to 3 -->
  <g transform="translate(550, 162)">
    <line x1="0" y1="15" x2="60" y2="15" stroke="#14B8A6" stroke-width="2"/>
    <polygon points="55,8 65,15 55,22" fill="#14B8A6"/>
  </g>

  <!-- STEP 3: DRILL (restore test) -->
  <g transform="translate(620, 78)">
    <rect x="0" y="0" width="220" height="210" rx="12" fill="#1a1a0a" stroke="#D4602A" stroke-width="2"/>
    <rect x="0" y="0" width="220" height="34" rx="12" fill="#D4602A" opacity="0.3"/>
    <rect x="0" y="22" width="220" height="12" fill="#D4602A" opacity="0.3"/>
    <text x="110" y="22" font-family="'Courier New', monospace" font-size="16" font-weight="bold" fill="#D4602A" text-anchor="middle">03 DRILL</text>
    <!-- Restore icon -->
    <rect x="70" y="46" width="80" height="55" rx="6" fill="#2a2a0a" stroke="#D4602A" stroke-width="1"/>
    <ellipse cx="110" cy="46" rx="40" ry="10" fill="#4a4a1a" stroke="#D4602A" stroke-width="1"/>
    <ellipse cx="110" cy="60" rx="40" ry="10" fill="#4a4a1a" opacity="0.5"/>
    <text x="110" y="84" font-family="'Courier New', monospace" font-size="14" fill="#D4602A" text-anchor="middle">RESTORED</text>
    <!-- Steps -->
    <text x="20" y="128" font-family="'Courier New', monospace" font-size="14" fill="#8a6a3a">download latest backup</text>
    <text x="20" y="148" font-family="'Courier New', monospace" font-size="14" fill="#8a6a3a">decrypt on isolated host</text>
    <text x="20" y="168" font-family="'Courier New', monospace" font-size="14" fill="#8a6a3a">mongorestore to temp DB</text>
    <!-- Schedule -->
    <rect x="20" y="182" width="180" height="24" rx="5" fill="#1a1000" stroke="#4a3010" stroke-width="1"/>
    <text x="110" y="198" font-family="'Courier New', monospace" font-size="14" fill="#D4602A" text-anchor="middle">AUTOMATED: weekly</text>
  </g>

  <!-- Bottom loop arrow (visual: cycle continues) -->
  <path d="M 840 308 C 840 360 450 390 60 360 C 60 340 60 330 60 320" fill="none" stroke="#14B8A6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <polygon points="54,324 60,312 66,324" fill="#14B8A6"/>
  <text x="450" y="378" font-family="'Courier New', monospace" font-size="14" fill="#14B8A6" text-anchor="middle" letter-spacing="1">REPEATS ON SCHEDULE -- automated, no manual steps</text>

  <!-- Key insight -->
  <rect x="170" y="398" width="560" height="28" rx="6" fill="#1a1a0a" stroke="#D4602A" stroke-width="1"/>
  <text x="450" y="418" font-family="Georgia, serif" font-size="14" fill="#D4602A" text-anchor="middle">A backup nobody has ever restored is a guess, not a backup.</text>

  <rect x="0" y="437" width="900" height="3" fill="#14B8A6"/>
</svg>
