    <rect x="0" y="18" width="220" height="6" rx="3" fill="#14B8A6" opacity="0.8"/>
    <!-- Arrowhead -->
    <polygon points="220,0 220,42 252,21" fill="#14B8A6" opacity="0.9"/>
    <!-- Migration label -->
    <text x="110" y="12" font-family="'Courier New', monospace" font-size="14" fill="#14B8A6" text-anchor="middle" letter-spacing="1">MIGRATION</text>
  </g>

