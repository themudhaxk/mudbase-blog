  <!-- Divider line -->
  <line x1="100" y1="80" x2="1100" y2="80" stroke="#1d3a22" stroke-width="1"/>

  <!-- LEFT PANEL: "Atlas (Before)" -->
  <rect x="60" y="110" width="380" height="390" rx="12" fill="url(#panelLeft)" stroke="#2a4a2e" stroke-width="1"/>
  <!-- Atlas cloud label -->
  <text x="250" y="148" font-family="'Courier New', monospace" font-size="16" fill="#47A248" text-anchor="middle" letter-spacing="2">BEFORE</text>

  <!-- MongoDB leaf icon (simplified) -->
  <ellipse cx="250" cy="200" rx="35" ry="55" fill="none" stroke="#47A248" stroke-width="2.5"/>
  <path d="M250 148 C250 148 278 174 278 200 C278 224 265 242 250 250 C235 242 222 224 222 200 C222 174 250 148 250 148Z" fill="#47A248" opacity="0.9"/>
