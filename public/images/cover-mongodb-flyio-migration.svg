  <rect x="248" y="216" width="4" height="28" fill="#47A248" rx="1"/>

  <text x="250" y="264" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#d4e8d4" text-anchor="middle">MongoDB Atlas</text>
  <text x="250" y="282" font-family="'Courier New', monospace" font-size="14" fill="#6a9a6a" text-anchor="middle">Managed cluster</text>

  <!-- Cost indicator -->
  <rect x="150" y="305" width="200" height="60" rx="8" fill="#0d2214" stroke="#2a4a2e" stroke-width="1"/>
  <text x="250" y="326" font-family="'Courier New', monospace" font-size="14" fill="#6a9a6a" text-anchor="middle">MONTHLY COST</text>
  <text x="250" y="354" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="#D4602A" text-anchor="middle">$$$</text>

  <!-- Pain points -->
  <text x="140" y="392" font-family="'Courier New', monospace" font-size="14" fill="#5a8a5a">&#x2022; Idle DBs cost full price</text>
  <text x="140" y="412" font-family="'Courier New', monospace" font-size="14" fill="#5a8a5a">&#x2022; Cluster-sized billing</text>
  <text x="140" y="432" font-family="'Courier New', monospace" font-size="14" fill="#5a8a5a">&#x2022; Vendor-managed ops</text>
  <text x="140" y="460" font-family="'Courier New', monospace" font-size="16" fill="#D4602A">BILL KEPT CLIMBING</text>

