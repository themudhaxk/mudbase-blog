<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Migrating MongoDB from Atlas to a self-hosted Fly.io cluster">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1F14;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0A1A24;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="panelLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2e1e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#142318;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="panelRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2438;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#111c2e;stop-opacity:1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- MongoDB simplified leaf mark -->
    <symbol id="mongodb-mark" viewBox="0 0 40 70">
      <path d="M20 5 C20 5 32 18 32 35 C32 50 26 60 20 65 C14 60 8 50 8 35 C8 18 20 5 20 5Z" fill="#47A248"/>
      <ellipse cx="20" cy="38" rx="5" ry="5" fill="#B8D9B4" opacity="0.7"/>
      <rect x="18.5" y="43" width="3" height="22" fill="#47A248" rx="1"/>
    </symbol>
    <!-- Fly.io simplified "fly" mark -->
    <symbol id="flyio-mark" viewBox="0 0 50 50">
      <rect x="5" y="5" width="40" height="40" rx="10" fill="#7B2FBE"/>
      <text x="25" y="34" font-family="Georgia, serif" font-size="26" font-weight="bold" fill="white" text-anchor="middle">F</text>
    </symbol>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1d3a22" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>

  <!-- Top bar with Mudbase wordmark area -->
  <rect x="0" y="0" width="1200" height="4" fill="#14B8A6"/>

