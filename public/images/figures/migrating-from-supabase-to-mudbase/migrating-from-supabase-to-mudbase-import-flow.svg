<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Mudbase Import dialog for Supabase: enter project URL and service role key, Mudbase imports users, collections, rows, and files.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="510" rx="20" fill="#020617"/>
  <rect width="1200" height="510" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="510" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="45" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">IMPORT DATA FROM SUPABASE</text>

  <!-- Left panel: Import dialog (x=60, y=62, w=500, h=402) -->
  <rect x="60" y="62" width="500" height="402" rx="16" fill="rgba(5,10,28,0.95)" stroke="rgba(0,113,254,0.45)" stroke-width="1"/>
  <!-- Panel header -->
  <rect x="60" y="62" width="500" height="56" rx="16 16 0 0" fill="rgba(0,113,254,0.20)" stroke="none"/>
  <rect x="60" y="98" width="500" height="20" rx="0" fill="rgba(0,113,254,0.20)" stroke="none"/>
  <text x="310" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Import Data</text>
  <!-- Tab bar (w=152 so "Supabase" 8-char 24pt mono 115px has 18-unit clearance each side) -->
  <rect x="80" y="132" width="152" height="36" rx="6" fill="rgba(0,113,254,0.30)" stroke="rgba(0,113,254,0.60)" stroke-width="1"/>
  <text x="156" y="155" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">Supabase</text>
  <!-- Form label 1 -->
  <text x="80" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#8899BB" text-anchor="start">Project URL</text>
  <!-- Input field 1 -->
  <rect x="80" y="212" width="460" height="48" rx="6" fill="rgba(10,20,50,0.80)" stroke="rgba(55,74,98,0.50)" stroke-width="1"/>
  <text x="96" y="242" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="400" fill="#374A62" text-anchor="start">https://your-project-url</text>
  <!-- Form label 2 -->
  <text x="80" y="286" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#8899BB" text-anchor="start">Service Role Key</text>
  <!-- Input field 2 -->
  <rect x="80" y="296" width="460" height="48" rx="6" fill="rgba(10,20,50,0.80)" stroke="rgba(55,74,98,0.50)" stroke-width="1"/>
  <text x="96" y="326" font-family="'Courier New', Courier, monospace" font-size="24" font-weight="400" fill="#374A62" text-anchor="start">your-service-role-key</text>
  <!-- Import button -->
  <rect x="80" y="366" width="460" height="64" rx="10" fill="rgba(0,113,254,0.85)" stroke="none"/>
  <text x="310" y="404" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Import from Supabase</text>

  <!-- Arrow (label removed - gap between panels is only 70px, label would cross both borders) -->
  <line x1="570" y1="297" x2="620" y2="297" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <!-- Right panel: Result (x=630, y=62, w=510, h=402) -->
  <rect x="630" y="62" width="510" height="402" rx="16" fill="rgba(5,10,28,0.95)" stroke="rgba(0,196,74,0.40)" stroke-width="1"/>
  <!-- Panel header -->
  <rect x="630" y="62" width="510" height="56" rx="16 16 0 0" fill="rgba(0,196,74,0.12)" stroke="none"/>
  <rect x="630" y="98" width="510" height="20" rx="0" fill="rgba(0,196,74,0.12)" stroke="none"/>
  <text x="885" y="98" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Imported to Mudbase</text>
  <!-- Result items (each h=80) -->
  <rect x="650" y="132" width="470" height="72" rx="8" fill="rgba(0,196,74,0.10)" stroke="rgba(0,196,74,0.30)" stroke-width="1"/>
  <circle cx="680" cy="168" r="10" fill="#00C464" opacity="0.85"/>
  <text x="706" y="176" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Auth Users</text>
  <rect x="650" y="214" width="470" height="72" rx="8" fill="rgba(0,196,74,0.10)" stroke="rgba(0,196,74,0.30)" stroke-width="1"/>
  <circle cx="680" cy="250" r="10" fill="#00C464" opacity="0.85"/>
  <text x="706" y="258" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Collections</text>
  <rect x="650" y="296" width="470" height="72" rx="8" fill="rgba(0,196,74,0.10)" stroke="rgba(0,196,74,0.30)" stroke-width="1"/>
  <circle cx="680" cy="332" r="10" fill="#00C464" opacity="0.85"/>
  <text x="706" y="340" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Rows + Documents</text>
  <rect x="650" y="378" width="470" height="72" rx="8" fill="rgba(0,196,74,0.10)" stroke="rgba(0,196,74,0.30)" stroke-width="1"/>
  <circle cx="680" cy="414" r="10" fill="#00C464" opacity="0.85"/>
  <text x="706" y="422" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Storage Files</text>
</svg>
