<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="AI SaaS request from sign-in to bill: user signs in, app calls AI feature, model runs, usage counted, plan checked and billed, result returned.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AA8"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="680" rx="20" fill="#020617"/>
  <rect width="1200" height="680" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="680" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">AI SAAS REQUEST: SIGN-IN TO BILL</text>

  <!-- Actor boxes -->
  <rect x="40" y="62" width="186" height="86" rx="10" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.48)" stroke-width="1.5"/>
  <text x="133" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">User</text>

  <rect x="306" y="62" width="186" height="86" rx="10" fill="rgba(74,144,226,0.14)" stroke="rgba(74,144,226,0.44)" stroke-width="1.5"/>
  <text x="399" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">App</text>

  <rect x="565" y="62" width="240" height="86" rx="10" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.55)" stroke-width="1.5"/>
  <text x="685" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>
  <text x="685" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Function</text>

  <rect x="906" y="62" width="254" height="86" rx="10" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.44)" stroke-width="1.5"/>
  <text x="1033" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>
  <text x="1033" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Payments</text>

  <!-- Lifelines (end at 640 = 680-40) -->
  <line x1="133" y1="148" x2="133" y2="640" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="399" y1="148" x2="399" y2="640" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="685" y1="148" x2="685" y2="640" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1033" y1="148" x2="1033" y2="640" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1: Sign in (User -> App), arrow at y=210, label at y=180 -->
  <rect x="173" y="168" width="88" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="217" y="187" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Sign in</text>
  <line x1="138" y1="214" x2="389" y2="214" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: Call AI feature (App -> Function), arrow at y=300, label at y=270 -->
  <rect x="430" y="258" width="178" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="519" y="277" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Call AI feature</text>
  <line x1="404" y1="304" x2="675" y2="304" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 3: Run model (self-loop at Function), arrow arc y=380-410, label to right -->
  <path d="M 690 384 L 760 384 L 760 412 L 700 412" fill="none" stroke="#6E5BFF" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="762" y="386" width="120" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="770" y="405" font-family="'Courier New',Courier,monospace" font-size="24" fill="#6E5BFF" text-anchor="start">Run model</text>

  <!-- Step 4: Count usage (Function -> Payments), arrow at y=484, label at y=454 -->
  <rect x="774" y="442" width="140" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="844" y="461" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Count usage</text>
  <line x1="690" y1="488" x2="1023" y2="488" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 5: Check plan, bill (Payments -> App, return), arrow at y=566, label at y=536 -->
  <rect x="628" y="524" width="180" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="718" y="543" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">Check plan, bill</text>
  <line x1="1028" y1="570" x2="409" y2="570" stroke="#6E8AA8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

  <!-- Step 6: Return result (App -> User, return), arrow at y=628, label at y=598 -->
  <rect x="176" y="586" width="150" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="251" y="605" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">Return result</text>
  <line x1="394" y1="632" x2="143" y2="632" stroke="#6E8AA8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
</svg>
