<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Fintech backend core steps: auth, balance accounts, append-only ledger, reconcile against the payment rail.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="50%" cy="20%" r="60%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="400" rx="20" fill="#020617"/>
  <rect width="1200" height="400" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="400" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="46" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">FINTECH BACKEND: CORE STEPS</text>

  <!-- Step circles (metadata, 22pt) -->
  <circle cx="150" cy="128" r="22" fill="#0071FE" opacity="0.90"/>
  <text x="150" y="135" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <circle cx="450" cy="128" r="22" fill="#0071FE" opacity="0.90"/>
  <text x="450" y="135" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <circle cx="750" cy="128" r="22" fill="#0071FE" opacity="0.90"/>
  <text x="750" y="135" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <circle cx="1050" cy="128" r="22" fill="#0071FE" opacity="0.90"/>
  <text x="1050" y="135" font-family="system-ui,-apple-system,sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>

  <!-- Step boxes: 260px wide, 16px padding on each side -->
  <!-- Auth: x=20, width=260, center=150; text padding: (260-w_text)/2 >= 16 -->
  <rect x="20" y="162" width="260" height="100" rx="12" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.50)" stroke-width="1.5"/>
  <text x="150" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Auth</text>
  <text x="150" y="242" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">auth primitive</text>

  <!-- Accounts: x=320 -->
  <rect x="320" y="162" width="260" height="100" rx="12" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.55)" stroke-width="1.5"/>
  <text x="450" y="204" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Accounts</text>
  <text x="450" y="238" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">ownerId, balance</text>

  <!-- Ledger: x=620 -->
  <rect x="620" y="162" width="260" height="100" rx="12" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.44)" stroke-width="1.5"/>
  <text x="750" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ledger</text>
  <text x="750" y="242" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">append-only</text>

  <!-- Reconcile: x=920 -->
  <rect x="920" y="162" width="260" height="100" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.40)" stroke-width="1.5"/>
  <text x="1050" y="210" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Reconcile</text>
  <text x="1050" y="242" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">match rails</text>

  <!-- Connecting arrows (gap = 320-280=40 and 920-880=40) -->
  <line x1="282" y1="212" x2="318" y2="212" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="582" y1="212" x2="618" y2="212" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="882" y1="212" x2="918" y2="212" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Caption: short, centered, grounded from post -->
  <text x="600" y="330" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">ledger is the source of truth; balance is derived</text>
</svg>
