<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="Fintech data model: accounts (ownerId, currency, balanceMinor) linked to ledger_entries (account, direction, amountMinor, transferId, idempotencyKey).">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#020617"/>
  <rect width="1200" height="440" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="46" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">FINTECH DATA MODEL</text>

  <!-- Left table: accounts (x=60, width=400) -->
  <rect x="60" y="68" width="400" height="236" rx="14" fill="rgba(110,91,255,0.14)" stroke="rgba(110,91,255,0.44)" stroke-width="1.5"/>
  <!-- Header band -->
  <rect x="60" y="68" width="400" height="52" rx="14" fill="rgba(110,91,255,0.30)" stroke="none"/>
  <rect x="60" y="98" width="400" height="22" rx="0" fill="rgba(110,91,255,0.30)" stroke="none"/>
  <text x="260" y="103" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">accounts</text>

  <!-- Field rows (name only, 24pt, centered, 40px row height) -->
  <text x="260" y="153" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">ownerId</text>
  <line x1="80" y1="170" x2="440" y2="170" stroke="rgba(90,140,255,0.15)" stroke-width="1"/>
  <text x="260" y="203" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">currency</text>
  <line x1="80" y1="220" x2="440" y2="220" stroke="rgba(90,140,255,0.15)" stroke-width="1"/>
  <text x="260" y="253" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">balanceMinor</text>

  <!-- Note below left table -->
  <text x="260" y="328" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">balance = sum of entries</text>

  <!-- Arrow between tables -->
  <line x1="462" y1="220" x2="738" y2="220" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="600" y="208" font-family="'Courier New',Courier,monospace" font-size="24" fill="#6E8AA8" text-anchor="middle">ref</text>

  <!-- Right table: ledger_entries (x=740, width=400) -->
  <rect x="740" y="68" width="400" height="316" rx="14" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1.5"/>
  <!-- Header band -->
  <rect x="740" y="68" width="400" height="52" rx="14" fill="rgba(0,113,254,0.28)" stroke="none"/>
  <rect x="740" y="98" width="400" height="22" rx="0" fill="rgba(0,113,254,0.28)" stroke="none"/>
  <text x="940" y="103" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">ledger_entries</text>

  <!-- 5 field rows -->
  <text x="940" y="153" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">account</text>
  <line x1="760" y1="170" x2="1120" y2="170" stroke="rgba(90,140,255,0.15)" stroke-width="1"/>
  <text x="940" y="203" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">direction</text>
  <line x1="760" y1="220" x2="1120" y2="220" stroke="rgba(90,140,255,0.15)" stroke-width="1"/>
  <text x="940" y="253" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">amountMinor</text>
  <line x1="760" y1="270" x2="1120" y2="270" stroke="rgba(90,140,255,0.15)" stroke-width="1"/>
  <text x="940" y="303" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">transferId</text>
  <line x1="760" y1="320" x2="1120" y2="320" stroke="rgba(90,140,255,0.15)" stroke-width="1"/>
  <text x="940" y="355" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">idempotencyKey</text>

  <!-- Note: immutable append-only -->
  <text x="940" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">immutable append-only</text>
</svg>
