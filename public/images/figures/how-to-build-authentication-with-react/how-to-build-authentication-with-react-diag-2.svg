<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-label="React Application connects to Mudbase, which provides authentication, database, storage, functions, realtime, and payments as built-in services.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="20" fill="#020617"/>
  <rect width="1200" height="720" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="48" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">REACT APP TO MUDBASE</text>

  <!-- React Application box: x=40, y=290, w=200, h=140, center y=360 -->
  <rect x="40" y="290" width="200" height="140" rx="12" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <text x="140" y="346" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">React</text>
  <text x="140" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">Application</text>

  <!-- Arrow React -> Mudbase -->
  <line x1="240" y1="360" x2="350" y2="360" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Mudbase box: x=350, y=290, w=200, h=140, center y=360 -->
  <rect x="350" y="290" width="200" height="140" rx="14" fill="rgba(0,113,254,0.20)" stroke="#0071FE" stroke-width="2"/>
  <text x="450" y="346" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#60A5FA" text-anchor="middle">Mudbase</text>
  <text x="450" y="384" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8899CC" text-anchor="middle">BaaS</text>

  <!-- 6 service boxes in one column: x=640, w=520, right=1160 -->
  <!-- h=80 each, gap=20. Total=6*80+5*20=580. Start y=(720-580)/2=70 -->
  <!-- Centers: 70+40=110, 70+100+20+40=210... let me compute: -->
  <!-- Auth: y=70, center=110 -->
  <!-- Database: y=170, center=210 -->
  <!-- Storage: y=270, center=310 -->
  <!-- Functions: y=370, center=410 -->
  <!-- Realtime: y=470, center=510 -->
  <!-- Payments: y=570, center=610 -->
  <!-- Last box bottom: 570+80=650. 720-650=70>40. Good. -->

  <!-- Fan lines from Mudbase right (x=550, y=360) to each service left (x=640) -->
  <line x1="550" y1="360" x2="640" y2="110" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="70" width="520" height="80" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="900" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#C8D8F0" text-anchor="middle">Authentication</text>

  <line x1="550" y1="360" x2="640" y2="210" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="170" width="520" height="80" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="900" y="218" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#C8D8F0" text-anchor="middle">Database</text>

  <line x1="550" y1="360" x2="640" y2="310" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="270" width="520" height="80" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="900" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#C8D8F0" text-anchor="middle">Storage</text>

  <line x1="550" y1="360" x2="640" y2="410" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="370" width="520" height="80" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="900" y="418" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#C8D8F0" text-anchor="middle">Functions</text>

  <line x1="550" y1="360" x2="640" y2="510" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="470" width="520" height="80" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="900" y="518" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#C8D8F0" text-anchor="middle">Realtime</text>

  <line x1="550" y1="360" x2="640" y2="610" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="640" y="570" width="520" height="80" rx="10" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.45)" stroke-width="1.5"/>
  <text x="900" y="618" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="500" fill="#00C464" text-anchor="middle">Payments</text>
</svg>
