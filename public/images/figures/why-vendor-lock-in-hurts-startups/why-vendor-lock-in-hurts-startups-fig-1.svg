<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Four types of vendor lock-in that compound over time: data lock-in, schema and model lock-in, API-surface lock-in, and operational lock-in.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="520" rx="20" fill="#020617"/>
  <rect width="1200" height="520" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="62" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3" text-anchor="start">VENDOR LOCK-IN COMPOUNDING</text>
  <!-- Box 1: Data lock-in -->
  <rect x="50" y="90" width="490" height="140" rx="14" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.38)" stroke-width="1.5"/>
  <circle cx="88" cy="130" r="22" fill="#00C464" opacity="0.9"/>
  <text x="88" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="300" y="151" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Data lock-in</text>
  <text x="300" y="187" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">your data in the vendor format</text>
  <!-- Arrow 1 -> 2 (right) -->
  <line x1="543" y1="160" x2="657" y2="160" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Box 2: Schema lock-in -->
  <rect x="660" y="90" width="490" height="140" rx="14" fill="rgba(249,115,22,0.13)" stroke="rgba(249,115,22,0.38)" stroke-width="1.5"/>
  <circle cx="698" cy="130" r="22" fill="#F97316" opacity="0.9"/>
  <text x="698" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="905" y="143" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Schema lock-in</text>
  <text x="905" y="179" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">model shaped by vendor</text>
  <!-- Arrow 2 -> 3 (down-left diagonal) -->
  <polyline points="905,232 905,280 300,280 300,304" fill="none" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Box 3: API-surface lock-in -->
  <rect x="50" y="312" width="490" height="140" rx="14" fill="rgba(249,115,22,0.16)" stroke="rgba(249,115,22,0.44)" stroke-width="1.5"/>
  <circle cx="88" cy="352" r="22" fill="#F97316" opacity="0.9"/>
  <text x="88" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
  <text x="300" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">API-surface lock-in</text>
  <text x="300" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">vendor SDK across the codebase</text>
  <!-- Arrow 3 -> 4 (right) -->
  <line x1="543" y1="382" x2="657" y2="382" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Box 4: Operational lock-in -->
  <rect x="660" y="312" width="490" height="140" rx="14" fill="rgba(245,56,56,0.16)" stroke="rgba(245,56,56,0.44)" stroke-width="1.5"/>
  <circle cx="698" cy="352" r="22" fill="#F56565" opacity="0.9"/>
  <text x="698" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
  <text x="905" y="373" font-family="system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Operational lock-in</text>
  <text x="905" y="409" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">runbooks tied to one vendor</text>
</svg>
