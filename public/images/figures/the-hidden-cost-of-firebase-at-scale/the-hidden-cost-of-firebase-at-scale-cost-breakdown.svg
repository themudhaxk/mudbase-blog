<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Firebase hidden costs at scale: Firestore reads and writes per operation, storage and egress on their own meter, functions billed per invocation, payments require a separate vendor.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="600" rx="20" fill="#020617"/>
  <rect width="1200" height="600" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="600" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="45" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">FIREBASE HIDDEN COSTS AT SCALE</text>

  <!-- Row 1: Firestore -->
  <rect x="52" y="62" width="1096" height="96" rx="10" fill="rgba(249,115,22,0.20)" stroke="rgba(249,115,22,0.50)" stroke-width="1"/>
  <text x="80" y="96" font-family="'Courier New', Courier, monospace" font-size="26" fill="#FB923C" text-anchor="start" letter-spacing="1">FIRESTORE</text>
  <text x="80" y="130" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#D4C8B4" text-anchor="start">reads and writes billed per operation</text>
  <circle cx="1120" cy="110" r="7" fill="#FB923C" opacity="0.55"/>

  <!-- Row 2: Storage + Egress -->
  <rect x="52" y="166" width="1096" height="96" rx="10" fill="rgba(234,179,8,0.18)" stroke="rgba(234,179,8,0.48)" stroke-width="1"/>
  <text x="80" y="200" font-family="'Courier New', Courier, monospace" font-size="26" fill="#FCD34D" text-anchor="start" letter-spacing="1">STORAGE + EGRESS</text>
  <text x="80" y="234" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#D4C8B4" text-anchor="start">files and bandwidth run on their own meter</text>
  <circle cx="1120" cy="214" r="7" fill="#FCD34D" opacity="0.55"/>

  <!-- Row 3: Cloud Functions -->
  <rect x="52" y="270" width="1096" height="96" rx="10" fill="rgba(168,85,247,0.16)" stroke="rgba(168,85,247,0.45)" stroke-width="1"/>
  <text x="80" y="304" font-family="'Courier New', Courier, monospace" font-size="26" fill="#C084FC" text-anchor="start" letter-spacing="1">CLOUD FUNCTIONS</text>
  <text x="80" y="338" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#D4C8B4" text-anchor="start">query logic relocated to functions bills per invocation</text>
  <circle cx="1120" cy="318" r="7" fill="#C084FC" opacity="0.55"/>

  <!-- Row 4: Payments -->
  <rect x="52" y="374" width="1096" height="96" rx="10" fill="rgba(239,68,68,0.16)" stroke="rgba(239,68,68,0.45)" stroke-width="1"/>
  <text x="80" y="408" font-family="'Courier New', Courier, monospace" font-size="26" fill="#F87171" text-anchor="start" letter-spacing="1">PAYMENTS</text>
  <text x="80" y="442" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#D4C8B4" text-anchor="start">not a native primitive, requires a separate vendor</text>
  <circle cx="1120" cy="422" r="7" fill="#F87171" opacity="0.55"/>

  <!-- Summary footer -->
  <rect x="52" y="486" width="1096" height="72" rx="10" fill="rgba(5,3,18,0.96)" stroke="rgba(249,115,22,0.50)" stroke-width="2"/>
  <text x="600" y="514" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#FB923C" text-anchor="middle">cost scales with operation count, which scales with usage</text>
  <text x="600" y="544" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#8899BB" text-anchor="middle">not obvious from your feature list</text>
</svg>
