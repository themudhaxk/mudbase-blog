<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="1200" height="580" role="img" aria-label="Auth is harder than it looks: the login form is one visible moment, but the full auth surface includes session management, password reset, rate limiting, and multi-factor auth.">
<defs>
  <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#0071FE"/></marker>
  <marker id="ag" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#00C464"/></marker>
  <marker id="ap" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6E5BFF"/></marker>
  <marker id="ao" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#F97316"/></marker>
  <marker id="am" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#6E8AA8"/></marker>
  <marker id="ar" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#EF4444"/></marker>
</defs>
<radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
  <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
  <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
</radialGradient>
<rect width="1200" height="580" rx="20" fill="#020617"/>
<rect width="1200" height="580" rx="20" fill="url(#bg-glow)"/>
<rect width="1200" height="580" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
<text x="60" y="44" font-family="'Courier New',monospace" font-size="24" fill="#8899BB" letter-spacing="2">THE FULL AUTH SURFACE</text>
<rect x="60" y="80" width="380" height="460" rx="12" fill="rgba(55,74,98,0.16)" stroke="rgba(55,74,98,0.5)" stroke-width="1"/>
<text x="250" y="124" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#8899BB" text-anchor="middle">What you see</text>
<rect x="100" y="144" width="300" height="290" rx="10" fill="rgba(30,40,60,0.5)" stroke="rgba(55,74,98,0.6)" stroke-width="1"/>
<text x="250" y="190" font-family="system-ui,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">Login Form</text>
<rect x="118" y="226" width="264" height="56" rx="6" fill="rgba(55,74,98,0.4)" stroke="rgba(90,140,255,0.3)" stroke-width="1"/>
<text x="250" y="261" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#C8D8F0" text-anchor="middle">Email field</text>
<rect x="118" y="298" width="264" height="56" rx="6" fill="rgba(55,74,98,0.4)" stroke="rgba(90,140,255,0.3)" stroke-width="1"/>
<text x="250" y="333" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#C8D8F0" text-anchor="middle">Password field</text>
<rect x="118" y="370" width="264" height="56" rx="6" fill="rgba(55,74,98,0.4)" stroke="rgba(90,140,255,0.3)" stroke-width="1"/>
<text x="250" y="405" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#C8D8F0" text-anchor="middle">Sign in button</text>
<text x="250" y="480" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="middle">Login is one moment</text>
<rect x="500" y="80" width="640" height="460" rx="12" fill="rgba(0,113,254,0.08)" stroke="rgba(0,113,254,0.35)" stroke-width="1"/>
<text x="820" y="124" font-family="system-ui,sans-serif" font-size="26" font-weight="700" fill="#8BC8FF" text-anchor="middle">What actually needs to work</text>
<text x="524" y="180" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="start">Session management</text>
<text x="524" y="212" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="start">a session has a full lifetime</text>
<text x="524" y="272" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="start">Password reset</text>
<text x="524" y="304" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="start">a second separate auth path</text>
<text x="524" y="364" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="start">Rate limiting</text>
<text x="524" y="396" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="start">brute-force protection</text>
<text x="524" y="456" font-family="system-ui,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="start">Multi-factor (MFA)</text>
<text x="524" y="488" font-family="system-ui,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="start">enrollment and recovery</text>
</svg>