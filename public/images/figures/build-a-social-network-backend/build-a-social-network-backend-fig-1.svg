<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Social network data model: profiles, posts, follows, and notifications as four collections with relations.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#020617"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">SOCIAL NETWORK DATA MODEL</text>

  <!-- 4 boxes in 2x2 grid -->
  <!-- Gap between columns: 120px. Left margin: 40. Right margin: 40. -->
  <!-- Box width: (1200 - 40 - 40 - 120) / 2 = 500 -->
  <!-- Col A: x=40, w=500, right=540. Col B: x=660, w=500, right=1160 -->
  <!-- Gap rows: 100px. Top margin: 66. Box height: 140. -->
  <!-- Row 1: y=66, h=140, bottom=206. Row 2: y=306, h=140, bottom=446. Bottom pad=74. OK. -->

  <!-- Box 1: profiles -->
  <rect x="40" y="66" width="500" height="140" rx="12" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.52)" stroke-width="1.5"/>
  <text x="290" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#60A5FA" text-anchor="middle">profiles</text>
  <text x="290" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">username, display name, bio</text>

  <!-- Box 2: posts -->
  <rect x="660" y="66" width="500" height="140" rx="12" fill="rgba(110,91,255,0.18)" stroke="rgba(110,91,255,0.52)" stroke-width="1.5"/>
  <text x="910" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#A78BFA" text-anchor="middle">posts</text>
  <text x="910" y="170" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">body, media, timestamp</text>

  <!-- Box 3: follows -->
  <rect x="40" y="306" width="500" height="140" rx="12" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.40)" stroke-width="1.5"/>
  <text x="290" y="366" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#00C464" text-anchor="middle">follows</text>
  <text x="290" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">follower, following, timestamp</text>

  <!-- Box 4: notifications -->
  <rect x="660" y="306" width="500" height="140" rx="12" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.40)" stroke-width="1.5"/>
  <text x="910" y="366" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#FB923C" text-anchor="middle">notifications</text>
  <text x="910" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">event type, read or unread</text>

  <!-- Arrows: plain, no pill labels (all relations are "creates" per the post) -->
  <!-- Top row: profiles -> posts (horizontal, in 120px gap centered at 600) -->
  <line x1="540" y1="136" x2="660" y2="136" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Left col: profiles -> follows (vertical, 100px gap centered at 256) -->
  <line x1="200" y1="206" x2="200" y2="306" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Right col: posts -> notifications (vertical) -->
  <line x1="860" y1="206" x2="860" y2="306" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Cross: follows -> notifications (horizontal, same gap) -->
  <line x1="540" y1="376" x2="660" y2="376" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
</svg>
