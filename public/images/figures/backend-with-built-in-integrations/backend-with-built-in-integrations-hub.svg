<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="App code calls one Mudbase connector which fans out to auth, database, storage, realtime, chat, email, and payments as built-in services.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="660" rx="20" fill="#020617"/>
  <rect width="1200" height="660" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="48" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">BUILT-IN INTEGRATIONS</text>

  <!-- App Code box: x=40, y=270, w=180, h=120, center y=330 -->
  <rect x="40" y="270" width="180" height="120" rx="12" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <text x="130" y="322" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">App</text>
  <text x="130" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">Code</text>

  <!-- Arrow App Code -> Mudbase hub -->
  <line x1="220" y1="330" x2="340" y2="330" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="280" y="318" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#60A5FA" text-anchor="middle">calls</text>

  <!-- Mudbase hub box: x=340, y=250, w=220, h=160, center y=330 -->
  <rect x="340" y="250" width="220" height="160" rx="14" fill="rgba(0,113,254,0.20)" stroke="#0071FE" stroke-width="2"/>
  <text x="450" y="320" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="#60A5FA" text-anchor="middle">Mudbase</text>
  <text x="450" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8899CC" text-anchor="middle">one SDK</text>

  <!-- 7 service boxes in a single column: x=700, w=460, right=1160 -->
  <!-- h=64 each, gap=16. Total=7*64+6*16=544. Start y=(660-544)/2=58 -->
  <!-- Services: Auth y=58, Database y=138, Storage y=218, Realtime y=298, Chat y=378, Email y=458, Payments y=538 -->

  <!-- Fan lines from Mudbase right edge center (x=560, y=330) to each service left edge (x=700, y=service_center) -->
  <!-- Auth center: 58+32=90 -->
  <line x1="560" y1="330" x2="700" y2="90" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="58" width="460" height="64" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="930" y="97" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#C8D8F0" text-anchor="middle">Auth</text>

  <!-- Database center: 138+32=170 -->
  <line x1="560" y1="330" x2="700" y2="170" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="138" width="460" height="64" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="930" y="177" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#C8D8F0" text-anchor="middle">Database</text>

  <!-- Storage center: 218+32=250 -->
  <line x1="560" y1="330" x2="700" y2="250" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="218" width="460" height="64" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="930" y="257" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#C8D8F0" text-anchor="middle">Storage</text>

  <!-- Realtime center: 298+32=330 (horizontal) -->
  <line x1="560" y1="330" x2="700" y2="330" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="298" width="460" height="64" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="930" y="337" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#C8D8F0" text-anchor="middle">Realtime</text>

  <!-- Chat center: 378+32=410 -->
  <line x1="560" y1="330" x2="700" y2="410" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="378" width="460" height="64" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="930" y="417" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#C8D8F0" text-anchor="middle">Chat</text>

  <!-- Email center: 458+32=490 -->
  <line x1="560" y1="330" x2="700" y2="490" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="458" width="460" height="64" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.45)" stroke-width="1"/>
  <text x="930" y="497" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#C8D8F0" text-anchor="middle">Email</text>

  <!-- Payments center: 538+32=570 -->
  <line x1="560" y1="330" x2="700" y2="570" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="700" y="538" width="460" height="64" rx="10" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.45)" stroke-width="1.5"/>
  <text x="930" y="577" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="500" fill="#00C464" text-anchor="middle">Payments</text>
</svg>
