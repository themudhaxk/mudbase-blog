<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Automated backup and drill cycle: backup script runs on schedule, drill script performs periodic restore, alert fires if restore fails.">
  <defs>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00C464"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#14B8A6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="50%" cy="20%" r="60%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#00C464" stop-opacity="0.07"/>
    <stop offset="100%" stop-color="#00C464" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="620" rx="20" fill="#020617"/>
  <rect width="1200" height="620" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="620" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">BACKUP / RESTORE / DRILL CYCLE</text>

  <!-- Left column nodes -->
  <!-- MongoDB Cluster -->
  <rect x="60" y="80" width="310" height="80" rx="12" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.44)" stroke-width="1.5"/>
  <text x="215" y="128" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">MongoDB Cluster</text>

  <!-- Backup Job -->
  <rect x="60" y="250" width="310" height="80" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1.5"/>
  <text x="215" y="298" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backup Job</text>

  <!-- Object Storage -->
  <rect x="60" y="420" width="310" height="80" rx="12" fill="rgba(55,74,98,0.20)" stroke="rgba(55,74,98,0.50)" stroke-width="1.5"/>
  <text x="215" y="468" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Object Storage</text>

  <!-- Right column nodes -->
  <!-- Drill Script -->
  <rect x="830" y="165" width="310" height="80" rx="12" fill="rgba(20,184,166,0.14)" stroke="rgba(20,184,166,0.44)" stroke-width="1.5"/>
  <text x="985" y="213" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Drill Script</text>

  <!-- Restore -->
  <rect x="830" y="335" width="310" height="80" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.38)" stroke-width="1.5"/>
  <text x="985" y="383" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Restore</text>

  <!-- Alert on Failure -->
  <rect x="830" y="490" width="310" height="62" rx="12" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.42)" stroke-width="1.5"/>
  <text x="985" y="529" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FB923C" text-anchor="middle">Alert on Failure</text>

  <!-- Left column arrows -->
  <!-- Cluster -> Backup Job -->
  <line x1="215" y1="160" x2="215" y2="246" stroke="#00C464" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="226" y="208" font-family="'Courier New', Courier, monospace" font-size="24" fill="#6E8AA8" text-anchor="start">dump on schedule</text>

  <!-- Backup Job -> Object Storage -->
  <line x1="215" y1="330" x2="215" y2="416" stroke="#00C464" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="226" y="378" font-family="'Courier New', Courier, monospace" font-size="24" fill="#6E8AA8" text-anchor="start">encrypt, prune old</text>

  <!-- Cross arrows -->
  <!-- Object Storage -> Drill Script -->
  <line x1="370" y1="460" x2="828" y2="248" stroke="#14B8A6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-teal)"/>
  <!-- label centred at x=530, well left of where diagonal crosses the rect (arrow at x=672 is at y=324, gap=40 units below rect bottom) -->
  <rect x="388" y="226" width="284" height="30" rx="4" fill="rgba(2,6,23,0.88)"/>
  <text x="530" y="248" font-family="'Courier New', Courier, monospace" font-size="24" fill="#14B8A6" text-anchor="middle">restore on schedule</text>

  <!-- Drill Script -> Restore -->
  <line x1="985" y1="245" x2="985" y2="331" stroke="#14B8A6" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="996" y="293" font-family="'Courier New', Courier, monospace" font-size="24" fill="#6E8AA8" text-anchor="start">restore</text>

  <!-- Restore -> Alert on Failure -->
  <line x1="985" y1="415" x2="985" y2="487" stroke="#F97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>
  <text x="996" y="456" font-family="'Courier New', Courier, monospace" font-size="24" fill="#F97316" text-anchor="start">on fail</text>
</svg>
