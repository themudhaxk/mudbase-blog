<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 530" width="1200" height="530" role="img" aria-label="Automated backup and drill cycle: backup script runs on schedule, drill script performs periodic restore, alert fires if restore fails.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AA8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00C464"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#14B8A6"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="530" rx="20" fill="#020617"/>
  <rect width="1200" height="530" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="530" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="38" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" letter-spacing="3" text-anchor="start">BACKUP / RESTORE / DRILL CYCLE</text>
  <rect x="195" y="95" width="210" height="70" rx="12" fill="rgba(47,107,255,0.16)" stroke="rgba(47,107,255,0.48)" stroke-width="1"/>
  <text x="300" y="137" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">MongoDB Cluster</text>
  <rect x="195" y="235" width="210" height="70" rx="12" fill="rgba(0,113,254,0.16)" stroke="rgba(0,113,254,0.48)" stroke-width="1"/>
  <text x="300" y="277" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backup Job</text>
  <rect x="195" y="375" width="210" height="70" rx="12" fill="rgba(0,113,254,0.12)" stroke="rgba(0,113,254,0.38)" stroke-width="1"/>
  <text x="300" y="417" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Object Storage</text>
  <rect x="795" y="165" width="210" height="70" rx="12" fill="rgba(20,184,166,0.16)" stroke="rgba(20,184,166,0.48)" stroke-width="1"/>
  <text x="900" y="207" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Drill Script</text>
  <rect x="795" y="305" width="210" height="70" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.38)" stroke-width="1"/>
  <text x="900" y="347" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Restore</text>
  <rect x="795" y="432" width="210" height="56" rx="12" fill="rgba(249,115,22,0.14)" stroke="rgba(249,115,22,0.50)" stroke-width="1"/>
  <text x="900" y="468" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FB923C" text-anchor="middle">Alert on Failure</text>
  <line x1="300" y1="165" x2="300" y2="231" stroke="#0071FE" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-blue)"/>
  <rect x="322" y="182" width="154" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="330" y="200" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E8AA8" text-anchor="start" letter-spacing="1">dump on schedule</text>
  <line x1="300" y1="305" x2="300" y2="371" stroke="#0071FE" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-blue)"/>
  <rect x="322" y="322" width="189" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="330" y="340" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E8AA8" text-anchor="start" letter-spacing="1">encrypts, prunes old</text>
  <path d="M 405 410 L 650 410 L 650 200 L 795 200" fill="none" stroke="#14B8A6" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-blue)"/>
  <rect x="437" y="367" width="180" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="527" y="385" font-family="'Courier New', Courier, monospace" font-size="14" fill="#14B8A6" text-anchor="middle" letter-spacing="1">restore on schedule</text>
  <line x1="900" y1="235" x2="900" y2="301" stroke="#14B8A6" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-blue)"/>
  <rect x="922" y="252" width="76" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="930" y="270" font-family="'Courier New', Courier, monospace" font-size="14" fill="#14B8A6" text-anchor="start" letter-spacing="1">restore</text>
  <line x1="900" y1="375" x2="900" y2="428" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-orange)"/>
  <rect x="922" y="378" width="154" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="930" y="396" font-family="'Courier New', Courier, monospace" font-size="14" fill="#F97316" text-anchor="start" letter-spacing="1">alert on failure</text>
  <line x1="60" y1="498" x2="88" y2="498" stroke="#2F6BFF" stroke-width="2" stroke-dasharray="none"/>
  <text x="96" y="503" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8899BB" text-anchor="start">Backup script</text>
  <line x1="320" y1="498" x2="348" y2="498" stroke="#14B8A6" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="356" y="503" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8899BB" text-anchor="start">Drill script</text>
  <line x1="580" y1="498" x2="608" y2="498" stroke="#F97316" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="616" y="503" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="400" fill="#8899BB" text-anchor="start">Failure alert</text>
</svg>