<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Chat architecture on Mudbase: web, mobile, and server clients connect to Mudbase for auth, realtime, and message storage.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="540" rx="20" fill="#020617"/>
  <rect width="1200" height="540" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="540" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">CHAT BACKEND ARCHITECTURE</text>

  <!-- Three client boxes, top row, well-spaced -->
  <rect x="60" y="72" width="240" height="80" rx="12" fill="rgba(97,218,251,0.12)" stroke="rgba(97,218,251,0.38)" stroke-width="1.5"/>
  <text x="180" y="119" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Web App</text>

  <rect x="480" y="72" width="240" height="80" rx="12" fill="rgba(74,144,226,0.12)" stroke="rgba(74,144,226,0.38)" stroke-width="1.5"/>
  <text x="600" y="119" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mobile App</text>

  <rect x="900" y="72" width="240" height="80" rx="12" fill="rgba(110,91,255,0.12)" stroke="rgba(110,91,255,0.38)" stroke-width="1.5"/>
  <text x="1020" y="119" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Server Client</text>

  <!-- Arrows from each client to Mudbase hub (no overlap label) -->
  <line x1="180" y1="152" x2="452" y2="228" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="600" y1="152" x2="600" y2="224" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="1020" y1="152" x2="748" y2="228" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Hub: Mudbase center -->
  <rect x="432" y="228" width="336" height="110" rx="16" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.55)" stroke-width="2"/>
  <text x="600" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>
  <text x="600" y="314" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="middle">auth, realtime, encrypt</text>

  <!-- Arrows down to service boxes -->
  <line x1="490" y1="338" x2="360" y2="390" stroke="#0071FE" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="710" y1="338" x2="840" y2="390" stroke="#0071FE" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>

  <!-- Database box: wide enough for "conversations" -->
  <rect x="110" y="390" width="440" height="100" rx="12" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.38)" stroke-width="1.5"/>
  <text x="330" y="432" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Database</text>
  <text x="330" y="462" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">conversations</text>

  <!-- Realtime box: wide enough for "typing and presence" -->
  <rect x="650" y="390" width="440" height="100" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.38)" stroke-width="1.5"/>
  <text x="870" y="432" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Realtime</text>
  <text x="870" y="462" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">typing and presence</text>
</svg>
