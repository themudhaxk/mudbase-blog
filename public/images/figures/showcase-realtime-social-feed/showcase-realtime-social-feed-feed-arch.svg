<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="Realtime social feed architecture: user posts trigger a database write, Mudbase Realtime broadcasts to subscribed clients.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#020617"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">REALTIME SOCIAL FEED ARCHITECTURE</text>

  <!-- 2x2 layout. 160px horizontal gap (wider). 40px margins. -->
  <!-- Col A: x=40 w=480 right=520. Col B: x=680 w=480 right=1160. Gap: 160px center=600 -->
  <!-- Row 1: y=66 h=140 (bottom=206). Row gap: 108px (y=206 to y=314). Row 2: y=314 h=140 (bottom=454). -->

  <!-- Box 1: User Posts (top-left) -->
  <rect x="40" y="66" width="480" height="140" rx="12" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.52)" stroke-width="1.5"/>
  <text x="280" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#60A5FA" text-anchor="middle">User Posts</text>

  <!-- Box 2: Database Write (top-right) -->
  <rect x="680" y="66" width="480" height="140" rx="12" fill="rgba(110,91,255,0.18)" stroke="rgba(110,91,255,0.52)" stroke-width="1.5"/>
  <text x="920" y="144" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#A78BFA" text-anchor="middle">Database Write</text>

  <!-- Box 3: Mudbase Realtime (bottom-left) -->
  <rect x="40" y="314" width="480" height="140" rx="12" fill="rgba(0,113,254,0.20)" stroke="#0071FE" stroke-width="2"/>
  <text x="280" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#60A5FA" text-anchor="middle">Mudbase Realtime</text>

  <!-- Box 4: Subscribed Clients (bottom-right) -->
  <rect x="680" y="314" width="480" height="140" rx="12" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.40)" stroke-width="1.5"/>
  <text x="920" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="700" fill="#00C464" text-anchor="middle">Subscribed Clients</text>

  <!-- Arrow 1: User Posts -> Database Write. Horizontal in 160px gap at y=120. Label above at y=108. -->
  <line x1="520" y1="120" x2="680" y2="120" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="108" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#60A5FA" text-anchor="middle">creates</text>

  <!-- Arrow 2: Database Write -> Mudbase Realtime. L-path: down from DB Write center (920, 206) to y=260, left to (280, 260), down to Mudbase Realtime top (280, 314). -->
  <!-- Label "broadcast" in horizontal segment in row gap, above the line at y=248. -->
  <line x1="920" y1="206" x2="920" y2="260" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="920" y1="260" x2="280" y2="260" stroke="#60A5FA" stroke-width="1.5"/>
  <line x1="280" y1="260" x2="280" y2="314" stroke="#60A5FA" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="248" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#60A5FA" text-anchor="middle">broadcast</text>

  <!-- Arrow 3: Mudbase Realtime -> Subscribed Clients. Horizontal in 160px gap at y=384. Label BELOW at y=410 (26px below arrow, in clear space in gap). -->
  <line x1="520" y1="384" x2="680" y2="384" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="412" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#60A5FA" text-anchor="middle">pushes event</text>
</svg>
