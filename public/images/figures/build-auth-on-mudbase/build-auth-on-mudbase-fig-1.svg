<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Mudbase auth sign-in flow: register, then log in to receive an access token and refresh token, use the access token for requests, and call the session endpoint to verify identity.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="700" rx="20" fill="#020617"/>
  <rect width="1200" height="700" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="700" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="48" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">AUTH SIGN-IN FLOW</text>
  <!-- Step boxes: x=50 w=1110 right=1160. No right-side tags. Center text at x=630. -->
  <!-- Step 1 -->
  <rect x="50" y="68" width="1110" height="100" rx="12" fill="rgba(110,91,255,0.14)" stroke="rgba(110,91,255,0.40)" stroke-width="1.5"/>
  <circle cx="94" cy="118" r="22" fill="rgba(110,91,255,0.50)"/>
  <text x="94" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
  <text x="630" y="107" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">POST /api/auth/local/register</text>
  <text x="630" y="143" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">email, password, and projectId in body</text>
  <!-- Arrow 1->2 -->
  <line x1="630" y1="170" x2="630" y2="190" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 2 -->
  <rect x="50" y="198" width="1110" height="100" rx="12" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.52)" stroke-width="1.5"/>
  <circle cx="94" cy="248" r="22" fill="rgba(0,113,254,0.50)"/>
  <text x="94" y="256" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
  <text x="630" y="237" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">POST /api/auth/local/login</text>
  <text x="630" y="273" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">log in with the same credentials</text>
  <!-- Arrow 2->3 -->
  <line x1="630" y1="300" x2="630" y2="320" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 3 -->
  <rect x="50" y="328" width="1110" height="100" rx="12" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.44)" stroke-width="1.5"/>
  <circle cx="94" cy="378" r="22" fill="rgba(0,196,74,0.50)"/>
  <text x="94" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
  <text x="630" y="367" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">access token + refresh token</text>
  <text x="630" y="403" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">JWT is short-lived; refresh is long-lived</text>
  <!-- Arrow 3->4 -->
  <line x1="630" y1="430" x2="630" y2="450" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 4 -->
  <rect x="50" y="458" width="1110" height="100" rx="12" fill="rgba(0,113,254,0.12)" stroke="rgba(0,113,254,0.36)" stroke-width="1.5"/>
  <circle cx="94" cy="508" r="22" fill="rgba(0,113,254,0.40)"/>
  <text x="94" y="516" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">4</text>
  <text x="630" y="497" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">GET /api/auth/local/session</text>
  <text x="630" y="533" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">to find out who a token belongs to</text>
  <!-- Footer note: shortened text with 14+ padding inside box -->
  <rect x="50" y="588" width="1110" height="68" rx="12" fill="rgba(0,196,74,0.08)" stroke="rgba(0,196,74,0.28)" stroke-width="1"/>
  <text x="630" y="629" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#6E8AA8" text-anchor="middle">Send the token as a Bearer header on authenticated requests</text>
</svg>
