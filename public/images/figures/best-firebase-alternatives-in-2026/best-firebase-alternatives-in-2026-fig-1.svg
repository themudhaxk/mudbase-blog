<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Firebase alternatives comparison: Mudbase, Supabase, Appwrite, and PocketBase across data model, payments, and hosting.">
  <rect width="1200" height="480" rx="20" fill="#020617"/>
  <rect width="1200" height="480" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">FIREBASE ALTERNATIVES</text>

  <!-- Label col: x=40 w=160 right=200. 4 product cols 240px each: 200,440,680,920 right=1160 -->

  <!-- Column headers y=60 h=68 -->
  <rect x="40" y="60" width="160" height="68" rx="8" fill="rgba(10,12,20,0.7)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>

  <rect x="200" y="60" width="240" height="68" rx="8" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.50)" stroke-width="1.5"/>
  <text x="320" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#60A5FA" text-anchor="middle">Mudbase</text>

  <rect x="440" y="60" width="240" height="68" rx="8" fill="rgba(62,207,142,0.15)" stroke="rgba(62,207,142,0.45)" stroke-width="1.5"/>
  <text x="560" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#3ECF8E" text-anchor="middle">Supabase</text>

  <rect x="680" y="60" width="240" height="68" rx="8" fill="rgba(240,82,82,0.15)" stroke="rgba(240,82,82,0.40)" stroke-width="1.5"/>
  <text x="800" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#F05252" text-anchor="middle">Appwrite</text>

  <rect x="920" y="60" width="240" height="68" rx="8" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.40)" stroke-width="1.5"/>
  <text x="1040" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FB923C" text-anchor="middle">PocketBase</text>

  <!-- Row: DATA MODEL y=128 h=110 -->
  <rect x="40" y="128" width="160" height="110" fill="rgba(10,12,20,0.6)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="60" y="190" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Data</text>

  <rect x="200" y="128" width="240" height="110" fill="rgba(0,113,254,0.08)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="320" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#60A5FA" font-weight="600" text-anchor="middle">Collections</text>

  <rect x="440" y="128" width="240" height="110" fill="rgba(10,12,20,0.6)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="560" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Postgres</text>

  <rect x="680" y="128" width="240" height="110" fill="rgba(10,12,20,0.6)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="800" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Collections</text>

  <rect x="920" y="128" width="240" height="110" fill="rgba(10,12,20,0.6)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="1040" y="192" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">SQLite</text>

  <!-- Row: PAYMENTS y=238 h=110 -->
  <rect x="40" y="238" width="160" height="110" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="60" y="300" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Payments</text>

  <rect x="200" y="238" width="240" height="110" fill="rgba(0,196,100,0.10)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="320" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#00C464" font-weight="600" text-anchor="middle">Built in</text>

  <rect x="440" y="238" width="240" height="110" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="560" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>

  <rect x="680" y="238" width="240" height="110" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="800" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>

  <rect x="920" y="238" width="240" height="110" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <text x="1040" y="302" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>

  <!-- Row: HOSTING y=348 h=90 -->
  <rect x="40" y="348" width="160" height="90" fill="rgba(10,12,20,0.4)" stroke="rgba(55,74,98,0.18)" stroke-width="1" rx="0 0 6 6"/>
  <text x="60" y="400" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Hosting</text>

  <rect x="200" y="348" width="240" height="90" fill="rgba(0,113,254,0.06)" stroke="rgba(55,74,98,0.2)" stroke-width="1" rx="0 0 6 6"/>
  <text x="320" y="402" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#60A5FA" font-weight="600" text-anchor="middle">Fully managed</text>

  <rect x="440" y="348" width="240" height="90" fill="rgba(10,12,20,0.4)" stroke="rgba(55,74,98,0.2)" stroke-width="1" rx="0 0 6 6"/>
  <text x="560" y="392" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0" text-anchor="middle">Managed</text>
  <text x="560" y="420" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#6E8AA8" text-anchor="middle">or self-hosted</text>

  <rect x="680" y="348" width="240" height="90" fill="rgba(10,12,20,0.4)" stroke="rgba(55,74,98,0.2)" stroke-width="1" rx="0 0 6 6"/>
  <text x="800" y="402" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Self-hosted</text>

  <rect x="920" y="348" width="240" height="90" fill="rgba(10,12,20,0.4)" stroke="rgba(55,74,98,0.2)" stroke-width="1" rx="0 0 6 6"/>
  <text x="1040" y="402" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Self-hosted</text>
</svg>
