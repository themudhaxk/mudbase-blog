<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-label="BaaS operation pairs: create user goes to auth API, create project to database API, upload file to storage API, backend logic to functions API.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="20" fill="#020617"/>
  <rect width="1200" height="440" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">BAAS OPERATION PAIRS</text>

  <!-- 4 columns of pairs, each col has an action box (top) and an API box (bottom) -->
  <!-- 4 cols with 40px margins and 20px gaps -->
  <!-- Total: 1200 - 80 - 60 = 1060 / 4 = 265 per col -->
  <!-- Col 1: x=40 w=265. Col 2: x=325. Col 3: x=610. Col 4: x=895 w=265 right=1160 -->

  <!-- Top row (action boxes): y=66 h=100 -->
  <rect x="40" y="66" width="265" height="100" rx="12" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.52)" stroke-width="1.5"/>
  <text x="172" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">Create User</text>

  <rect x="325" y="66" width="265" height="100" rx="12" fill="rgba(110,91,255,0.18)" stroke="rgba(110,91,255,0.52)" stroke-width="1.5"/>
  <text x="457" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">Create Project</text>

  <rect x="610" y="66" width="265" height="100" rx="12" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.40)" stroke-width="1.5"/>
  <text x="742" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">Upload File</text>

  <rect x="895" y="66" width="265" height="100" rx="12" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.40)" stroke-width="1.5"/>
  <text x="1027" y="122" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="middle">Backend Logic</text>

  <!-- Arrows: vertical, from action box bottom to API box top -->
  <line x1="172" y1="166" x2="172" y2="236" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="457" y1="166" x2="457" y2="236" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="742" y1="166" x2="742" y2="236" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1027" y1="166" x2="1027" y2="236" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bottom row (API boxes): y=236 h=100 -->
  <rect x="40" y="236" width="265" height="100" rx="12" fill="rgba(0,113,254,0.12)" stroke="rgba(0,113,254,0.35)" stroke-width="1.5"/>
  <text x="172" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#60A5FA" text-anchor="middle">Auth API</text>

  <rect x="325" y="236" width="265" height="100" rx="12" fill="rgba(110,91,255,0.12)" stroke="rgba(110,91,255,0.35)" stroke-width="1.5"/>
  <text x="457" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#A78BFA" text-anchor="middle">Database API</text>

  <rect x="610" y="236" width="265" height="100" rx="12" fill="rgba(0,196,100,0.10)" stroke="rgba(0,196,100,0.35)" stroke-width="1.5"/>
  <text x="742" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#00C464" text-anchor="middle">Storage API</text>

  <rect x="895" y="236" width="265" height="100" rx="12" fill="rgba(249,115,22,0.10)" stroke="rgba(249,115,22,0.35)" stroke-width="1.5"/>
  <text x="1027" y="292" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FB923C" text-anchor="middle">Functions API</text>
</svg>
