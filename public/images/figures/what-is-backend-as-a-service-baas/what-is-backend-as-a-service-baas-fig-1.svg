<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" width="1200" height="660" role="img" aria-label="Custom backend versus BaaS: auth, database, file storage, functions, and payments each require building and maintaining yourself, while BaaS provides all of them as managed services.">
  <defs/>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="660" rx="20" fill="#020617"/>
  <rect width="1200" height="660" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="660" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="48" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3" text-anchor="start">CUSTOM BACKEND vs BAAS</text>
  <!-- Column headers: y=64 h=68 -->
  <rect x="50" y="64" width="540" height="68" rx="10" fill="rgba(249,115,22,0.16)" stroke="rgba(249,115,22,0.45)" stroke-width="1.5"/>
  <text x="320" y="107" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FB923C" text-anchor="middle">WITHOUT BAAS</text>
  <rect x="610" y="64" width="540" height="68" rx="10" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.50)" stroke-width="1.5"/>
  <text x="880" y="107" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#60A5FA" text-anchor="middle">WITH BAAS</text>

  <!-- 5 data rows, h=84 each. Start y=142. -->
  <!-- Left column: row label at row_y+28 (cap top ~row_y+8), value text at row_y+58 -->
  <!-- Right column: no duplicate label. Pill centered: pill rect y=row_y+22 h=40, text y=row_y+48 -->

  <!-- Row 1: AUTH y=142 -->
  <rect x="50" y="142" width="540" height="84" fill="rgba(8,12,28,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="610" y="142" width="540" height="84" fill="rgba(4,10,22,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="66" y="170" font-family="'Courier New',Courier,monospace" font-size="22" fill="#6E8AA8" letter-spacing="1">AUTH</text>
  <text x="70" y="206" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0">Build and maintain yourself</text>
  <rect x="666" y="164" width="228" height="40" rx="20" fill="#00C464" fill-opacity="0.20" stroke="#00C464" stroke-opacity="0.50" stroke-width="1"/>
  <text x="780" y="189" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#00C464" text-anchor="middle">Managed service</text>

  <!-- Row 2: DATABASE y=226 -->
  <rect x="50" y="226" width="540" height="84" fill="rgba(12,16,36,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="610" y="226" width="540" height="84" fill="rgba(8,14,28,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="66" y="254" font-family="'Courier New',Courier,monospace" font-size="22" fill="#6E8AA8" letter-spacing="1">DATABASE</text>
  <text x="70" y="290" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0">Build and maintain yourself</text>
  <rect x="666" y="248" width="228" height="40" rx="20" fill="#00C464" fill-opacity="0.20" stroke="#00C464" stroke-opacity="0.50" stroke-width="1"/>
  <text x="780" y="273" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#00C464" text-anchor="middle">Managed service</text>

  <!-- Row 3: FILE STORAGE y=310 -->
  <rect x="50" y="310" width="540" height="84" fill="rgba(8,12,28,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="610" y="310" width="540" height="84" fill="rgba(4,10,22,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="66" y="338" font-family="'Courier New',Courier,monospace" font-size="22" fill="#6E8AA8" letter-spacing="1">FILE STORAGE</text>
  <text x="70" y="374" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0">Build and maintain yourself</text>
  <rect x="666" y="332" width="228" height="40" rx="20" fill="#00C464" fill-opacity="0.20" stroke="#00C464" stroke-opacity="0.50" stroke-width="1"/>
  <text x="780" y="357" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#00C464" text-anchor="middle">Managed service</text>

  <!-- Row 4: FUNCTIONS y=394 -->
  <rect x="50" y="394" width="540" height="84" fill="rgba(12,16,36,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="610" y="394" width="540" height="84" fill="rgba(8,14,28,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="66" y="422" font-family="'Courier New',Courier,monospace" font-size="22" fill="#6E8AA8" letter-spacing="1">FUNCTIONS</text>
  <text x="70" y="458" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0">Build and maintain yourself</text>
  <rect x="666" y="416" width="228" height="40" rx="20" fill="#00C464" fill-opacity="0.20" stroke="#00C464" stroke-opacity="0.50" stroke-width="1"/>
  <text x="780" y="441" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#00C464" text-anchor="middle">Managed service</text>

  <!-- Row 5: PAYMENTS y=478 -->
  <rect x="50" y="478" width="540" height="84" fill="rgba(8,12,28,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="610" y="478" width="540" height="84" fill="rgba(4,10,22,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="66" y="506" font-family="'Courier New',Courier,monospace" font-size="22" fill="#6E8AA8" letter-spacing="1">PAYMENTS</text>
  <text x="70" y="542" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0">Build and maintain yourself</text>
  <rect x="666" y="500" width="228" height="40" rx="20" fill="#00C464" fill-opacity="0.20" stroke="#00C464" stroke-opacity="0.50" stroke-width="1"/>
  <text x="780" y="525" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#00C464" text-anchor="middle">Managed service</text>

  <!-- Footer note: data rows end at y=562. Footer y=576, h=44 → bottom=620. Dead band=660-620=40 -->
  <rect x="50" y="576" width="1100" height="44" rx="10" fill="rgba(0,113,254,0.10)" stroke="rgba(0,113,254,0.30)" stroke-width="1"/>
  <text x="600" y="604" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="500" fill="#8BB8F0" text-anchor="middle">BaaS provides these capabilities as managed services.</text>
</svg>
