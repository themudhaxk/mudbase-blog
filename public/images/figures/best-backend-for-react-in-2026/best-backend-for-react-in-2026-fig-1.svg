<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="React and Mudbase: React components use the Mudbase SDK to call auth, read and write the database, upload to storage, and subscribe to realtime events.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="560" rx="20" fill="#020617"/>
  <rect width="1200" height="560" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="560" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">REACT + MUDBASE INTEGRATION</text>

  <!-- Left: React Component box -->
  <rect x="60" y="90" width="260" height="390" rx="16" fill="rgba(97,218,251,0.10)" stroke="rgba(97,218,251,0.40)" stroke-width="1.5"/>
  <text x="190" y="148" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#61DAFB" text-anchor="middle">React</text>
  <text x="190" y="184" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#61DAFB" text-anchor="middle">Component</text>

  <!-- React atom icon -->
  <circle cx="190" cy="310" r="24" fill="none" stroke="#61DAFB" stroke-width="2.5" opacity="0.6"/>
  <circle cx="190" cy="310" r="7" fill="#61DAFB" opacity="0.7"/>
  <ellipse cx="190" cy="310" rx="42" ry="16" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.4" transform="rotate(60 190 310)"/>
  <ellipse cx="190" cy="310" rx="42" ry="16" fill="none" stroke="#61DAFB" stroke-width="1.5" opacity="0.4" transform="rotate(-60 190 310)"/>

  <!-- Arrow: React -> SDK -->
  <line x1="320" y1="285" x2="462" y2="285" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="390" y="272" font-family="'Courier New', Courier, monospace" font-size="24" fill="#0071FE" text-anchor="middle" letter-spacing="1">SDK calls</text>

  <!-- Center: Mudbase SDK -->
  <rect x="462" y="198" width="236" height="174" rx="14" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.55)" stroke-width="1.5"/>
  <text x="580" y="268" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>
  <text x="580" y="308" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">SDK</text>
  <text x="580" y="346" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="middle">one import, all services</text>

  <!-- Vertical bus line from SDK to services -->
  <line x1="698" y1="285" x2="730" y2="285" stroke="#0071FE" stroke-width="2" opacity="0.55"/>
  <line x1="730" y1="108" x2="730" y2="462" stroke="#0071FE" stroke-width="2" opacity="0.55"/>

  <!-- Right service boxes -->
  <!-- Auth -->
  <line x1="730" y1="108" x2="862" y2="108" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="862" y="68" width="278" height="80" rx="12" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.45)" stroke-width="1.5"/>
  <text x="1001" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Auth</text>
  <text x="1001" y="132" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">sign up, sign in</text>

  <!-- Database -->
  <line x1="730" y1="218" x2="862" y2="218" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="862" y="178" width="278" height="80" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.40)" stroke-width="1.5"/>
  <text x="1001" y="214" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Database</text>
  <text x="1001" y="242" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">store and query</text>

  <!-- Storage -->
  <line x1="730" y1="352" x2="862" y2="352" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="862" y="312" width="278" height="80" rx="12" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.38)" stroke-width="1.5"/>
  <text x="1001" y="348" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Storage</text>
  <text x="1001" y="376" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">file upload</text>

  <!-- Realtime -->
  <line x1="730" y1="462" x2="862" y2="462" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="862" y="422" width="278" height="80" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.38)" stroke-width="1.5"/>
  <text x="1001" y="458" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Realtime</text>
  <text x="1001" y="486" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">live updates</text>
</svg>
