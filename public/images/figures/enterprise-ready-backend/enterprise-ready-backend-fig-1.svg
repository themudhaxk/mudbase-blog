<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Enterprise features hub: Mudbase at center, OIDC SSO shipped, RBAC, audit log, and GDPR controls as satellite nodes.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="640" rx="20" fill="#020617"/>
  <rect width="1200" height="640" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="640" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">ENTERPRISE FEATURES</text>

  <!-- Hub: Mudbase center at (600, 320) -->
  <rect x="460" y="260" width="280" height="120" rx="16" fill="rgba(0,113,254,0.22)" stroke="rgba(0,113,254,0.60)" stroke-width="2"/>
  <text x="600" y="316" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>
  <text x="600" y="352" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">enterprise controls</text>

  <!-- OIDC SSO: top right. x=820, y=52, w=320, h=96. Center=(980,100) -->
  <!-- Connector: Hub top-right (670,270) -> OIDC bottom-left (820,148) -->
  <line x1="672" y1="270" x2="826" y2="148" stroke="#0071FE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <rect x="820" y="52" width="320" height="96" rx="12" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.48)" stroke-width="1.5"/>
  <text x="980" y="96" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">OIDC SSO</text>
  <text x="980" y="128" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">shipped</text>

  <!-- RBAC: right. x=880, y=272, w=280, h=96. Center=(1020,320) -->
  <!-- Connector: Hub right (740,320) -> RBAC left (880,320) -->
  <line x1="742" y1="320" x2="878" y2="320" stroke="#0071FE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <rect x="880" y="272" width="280" height="96" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1.5"/>
  <text x="1020" y="316" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">RBAC</text>
  <text x="1020" y="350" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">role-based access</text>

  <!-- Audit Log: bottom. x=380, y=492, w=440, h=96. Center=(600,540) -->
  <!-- Connector: Hub bottom (600,380) -> Audit Log top (600,492) -->
  <line x1="600" y1="382" x2="600" y2="490" stroke="#0071FE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <rect x="380" y="492" width="440" height="96" rx="12" fill="rgba(249,115,22,0.14)" stroke="rgba(249,115,22,0.44)" stroke-width="1.5"/>
  <text x="600" y="536" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Audit Log</text>
  <text x="600" y="568" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">who did what and when</text>

  <!-- GDPR: left. x=40, y=272, w=340, h=96. Center=(210,320) -->
  <!-- Connector: GDPR right (380,320) -> Hub left (458,320) -->
  <line x1="382" y1="320" x2="458" y2="320" stroke="#0071FE" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arrow-blue)"/>
  <rect x="40" y="272" width="340" height="96" rx="12" fill="rgba(20,184,166,0.12)" stroke="rgba(20,184,166,0.42)" stroke-width="1.5"/>
  <text x="210" y="316" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">GDPR</text>
  <text x="210" y="350" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">data subject rights</text>
</svg>
