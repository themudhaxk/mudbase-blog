<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Event ticketing app: organizer, attendee, and QR check-in clients use Mudbase auth and database to manage events, bookings, and activity.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="600" rx="20" fill="#020617"/>
  <rect width="1200" height="600" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="600" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">EVENT TICKETING APP ARCHITECTURE</text>

  <!-- Left: Event App box with 3 user roles -->
  <rect x="40" y="80" width="280" height="370" rx="16" fill="rgba(110,91,255,0.12)" stroke="rgba(110,91,255,0.38)" stroke-width="1.5"/>
  <text x="180" y="136" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF" text-anchor="middle">Event App</text>

  <rect x="68" y="164" width="224" height="60" rx="8" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.40)" stroke-width="1"/>
  <text x="180" y="200" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">Organizer</text>

  <rect x="68" y="244" width="224" height="60" rx="8" fill="rgba(110,91,255,0.14)" stroke="rgba(110,91,255,0.36)" stroke-width="1"/>
  <text x="180" y="280" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">Attendee</text>

  <rect x="68" y="324" width="224" height="60" rx="8" fill="rgba(110,91,255,0.12)" stroke="rgba(110,91,255,0.34)" stroke-width="1"/>
  <text x="180" y="360" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">QR check-in</text>

  <!-- Arrow: Event App -> Mudbase -->
  <line x1="320" y1="265" x2="450" y2="265" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Center: Mudbase hub -->
  <rect x="450" y="170" width="250" height="190" rx="16" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.55)" stroke-width="2"/>
  <text x="575" y="240" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>

  <!-- Auth / Database chips inside hub -->
  <rect x="468" y="264" width="100" height="44" rx="8" fill="rgba(110,91,255,0.20)" stroke="rgba(110,91,255,0.45)" stroke-width="1"/>
  <text x="518" y="293" font-family="'Courier New', Courier, monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Auth</text>

  <rect x="582" y="264" width="100" height="44" rx="8" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.45)" stroke-width="1"/>
  <text x="632" y="293" font-family="'Courier New', Courier, monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">DB</text>

  <!-- Arrow: Mudbase -> Collections (label "stores" 15 units above arrow) -->
  <line x1="700" y1="265" x2="800" y2="265" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="706" y="220" width="84" height="30" rx="4" fill="rgba(2,6,23,0.88)"/>
  <text x="748" y="242" font-family="'Courier New', Courier, monospace" font-size="24" fill="#6E8AA8" text-anchor="middle">stores</text>

  <!-- Right: Collection boxes -->
  <!-- events -->
  <rect x="800" y="62" width="360" height="150" rx="12" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.38)" stroke-width="1.5"/>
  <text x="980" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">events</text>
  <text x="980" y="138" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">capacity, organizerId</text>
  <text x="980" y="166" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">status</text>

  <!-- bookings -->
  <rect x="800" y="228" width="360" height="150" rx="12" fill="rgba(0,113,254,0.12)" stroke="rgba(0,113,254,0.38)" stroke-width="1.5"/>
  <text x="980" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">bookings</text>
  <text x="980" y="304" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">eventId, userId</text>
  <text x="980" y="332" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">status</text>

  <!-- activity -->
  <rect x="800" y="394" width="360" height="150" rx="12" fill="rgba(20,184,166,0.10)" stroke="rgba(20,184,166,0.36)" stroke-width="1.5"/>
  <text x="980" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">activity</text>
  <text x="980" y="470" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">eventId, actorId</text>
  <text x="980" y="498" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">action</text>
</svg>
