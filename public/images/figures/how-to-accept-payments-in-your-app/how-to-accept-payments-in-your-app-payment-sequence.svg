<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Payment flow checkout to access: app creates checkout, Mudbase collects on payment rail in supported markets, webhook confirms, access turns on.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AA8"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="620" rx="20" fill="#020617"/>
  <rect width="1200" height="620" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="620" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">PAYMENT FLOW: CHECKOUT TO ACCESS</text>

  <!-- Actor boxes -->
  <rect x="60" y="62" width="220" height="86" rx="10" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.48)" stroke-width="1.5"/>
  <text x="170" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">App</text>

  <rect x="440" y="62" width="220" height="86" rx="10" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.55)" stroke-width="1.5"/>
  <text x="550" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>

  <rect x="840" y="62" width="300" height="86" rx="10" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.40)" stroke-width="1.5"/>
  <text x="990" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Payment Rail</text>
  <text x="990" y="130" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="400" fill="#6E8AA8" text-anchor="middle">supported markets</text>

  <!-- Lifelines (end at 580 = 620-40) -->
  <line x1="170" y1="148" x2="170" y2="580" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="550" y1="148" x2="550" y2="580" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="990" y1="148" x2="990" y2="580" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1: Create checkout (App -> Mudbase), arrow y=210, label y=180 -->
  <rect x="210" y="168" width="264" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="342" y="187" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Create checkout</text>
  <line x1="175" y1="214" x2="540" y2="214" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: Checkout link (Mudbase -> App, return), arrow y=290, label y=260 -->
  <rect x="242" y="248" width="160" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="322" y="267" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">Checkout link</text>
  <line x1="545" y1="294" x2="180" y2="294" stroke="#6E8AA8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

  <!-- Step 3: Collect on payment rail (Mudbase -> Rail), arrow y=374, label y=344 -->
  <rect x="600" y="332" width="284" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="742" y="351" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Collect on payment rail</text>
  <line x1="555" y1="378" x2="980" y2="378" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 4: Webhook confirms (Rail -> Mudbase, return), arrow y=454, label y=424 -->
  <rect x="610" y="412" width="234" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="727" y="431" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">Webhook confirms</text>
  <line x1="985" y1="458" x2="565" y2="458" stroke="#6E8AA8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

  <!-- Step 5: Access turns on (Mudbase -> App, return), arrow y=534, label y=504 -->
  <rect x="250" y="492" width="208" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="354" y="511" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">Access turns on</text>
  <line x1="545" y1="538" x2="180" y2="538" stroke="#6E8AA8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>
</svg>
