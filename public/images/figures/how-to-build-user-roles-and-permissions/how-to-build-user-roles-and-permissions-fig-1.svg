<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="1200" height="740" role="img" aria-label="RBAC: user is assigned a role, role carries permissions, policy narrows by data. Support agent can read tickets but cannot delete a user.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00C464"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="740" rx="20" fill="#020617"/>
  <rect width="1200" height="740" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="740" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="45" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">ROLES, PERMISSIONS, POLICIES</text>

  <!-- Node 1: User -->
  <rect x="420" y="62" width="360" height="64" rx="12" fill="rgba(55,74,98,0.30)" stroke="rgba(55,74,98,0.55)" stroke-width="1"/>
  <text x="600" y="100" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">User</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="600" y1="126" x2="600" y2="162" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 2: Role -->
  <rect x="420" y="164" width="360" height="96" rx="12" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.48)" stroke-width="1"/>
  <text x="600" y="202" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Role</text>
  <text x="600" y="238" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">admin, agent, customer</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="600" y1="260" x2="600" y2="296" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 3: Permission -->
  <rect x="420" y="298" width="360" height="96" rx="12" fill="rgba(0,113,254,0.16)" stroke="rgba(0,113,254,0.48)" stroke-width="1"/>
  <text x="600" y="336" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Permission</text>
  <text x="600" y="372" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">named capabilities</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="600" y1="394" x2="600" y2="430" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 4: Policy -->
  <rect x="420" y="432" width="360" height="96" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1"/>
  <text x="600" y="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Policy</text>
  <text x="600" y="506" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">read own orders</text>

  <!-- Branch paths to outcomes -->
  <path d="M 420 528 L 420 560 L 220 560 L 220 586" fill="none" stroke="#00C464" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="360" y="554" font-family="'Courier New', Courier, monospace" font-size="24" fill="#00C464" text-anchor="middle" letter-spacing="1">ALLOW</text>
  <path d="M 780 528 L 780 560 L 980 560 L 980 586" fill="none" stroke="#DC4040" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="840" y="554" font-family="'Courier New', Courier, monospace" font-size="24" fill="#F87171" text-anchor="middle" letter-spacing="1">DENY</text>

  <!-- Outcome: read tickets -->
  <rect x="80" y="588" width="280" height="72" rx="12" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.45)" stroke-width="1"/>
  <text x="220" y="630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">read tickets</text>

  <!-- Outcome: not delete a user -->
  <rect x="840" y="588" width="280" height="72" rx="12" fill="rgba(220,64,64,0.14)" stroke="rgba(220,64,64,0.48)" stroke-width="1"/>
  <text x="980" y="630" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#F87171" text-anchor="middle">not delete a user</text>
</svg>
