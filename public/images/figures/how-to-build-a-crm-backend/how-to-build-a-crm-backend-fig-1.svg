<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="CRM data model: contacts, deals, pipeline stages, and activities as four collections with relations.">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#020617"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">CRM DATA MODEL</text>

  <!-- 3 top boxes with 160px gaps, 40px margins -->
  <!-- Total: 1200 - 80 - 320 = 800 / 3 = 266 per box -->
  <!-- contacts x=40 w=266 right=306; gap 306-466 (160px center=386); deals x=466 w=268 right=734; gap 734-894 (160px center=814); activities x=894 w=266 right=1160 -->
  <!-- Top boxes y=66 h=140 (bottom=206) -->

  <rect x="40" y="66" width="266" height="140" rx="12" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.52)" stroke-width="1.5"/>
  <text x="173" y="124" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#60A5FA" text-anchor="middle">contacts</text>
  <text x="173" y="162" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">name, email, source</text>

  <rect x="466" y="66" width="268" height="140" rx="12" fill="rgba(110,91,255,0.18)" stroke="rgba(110,91,255,0.52)" stroke-width="1.5"/>
  <text x="600" y="124" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#A78BFA" text-anchor="middle">deals</text>
  <text x="600" y="162" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">value, stage, owner</text>

  <rect x="894" y="66" width="266" height="140" rx="12" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.40)" stroke-width="1.5"/>
  <text x="1027" y="116" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#00C464" text-anchor="middle">activities</text>
  <text x="1027" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">call, email, note</text>
  <text x="1027" y="188" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#6E8AA8" text-anchor="middle">tied to contact or deal</text>

  <!-- Horizontal arrows in 160px gaps - no labels (wide enough but dropped for clarity) -->
  <!-- contacts -> deals: arrow at y=136 (box center). In 160px gap between x=306 and x=466. -->
  <line x1="306" y1="136" x2="466" y2="136" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <!-- deals -> activities: arrow at y=136 -->
  <line x1="734" y1="136" x2="894" y2="136" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>

  <!-- pipeline stages box: bottom-left -->
  <!-- Vertical gap between row 1 (bottom=206) and row 2 (top=314): 108px. Center y=260. -->
  <rect x="40" y="314" width="266" height="140" rx="12" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.40)" stroke-width="1.5"/>
  <text x="173" y="372" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FB923C" text-anchor="middle">pipeline stages</text>
  <text x="173" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">lead, qualified, won</text>

  <!-- deals -> pipeline stages: elbow goes below contacts box -->
  <!-- Horizontal from deals bottom-center (600, 206) left to x=173, at y=230 (24px below box bottom=206) -->
  <!-- Then vertical at x=173 from y=230 down to pipeline stages top y=314 -->
  <line x1="600" y1="206" x2="600" y2="230" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="600" y1="230" x2="173" y2="230" stroke="#A78BFA" stroke-width="1.5"/>
  <line x1="173" y1="230" x2="173" y2="314" stroke="#A78BFA" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- label "moves through" in vertical gap, left of vertical line -->
  <text x="185" y="276" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#A78BFA" text-anchor="start">moves through</text>
</svg>
