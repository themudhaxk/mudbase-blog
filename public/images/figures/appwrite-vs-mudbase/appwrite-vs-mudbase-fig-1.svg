<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Side-by-side: Appwrite services without a payments primitive versus Mudbase with payments built in alongside auth, database, storage, functions.">
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="620" rx="20" fill="#020617"/>
  <rect width="1200" height="620" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="620" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="45" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">APPWRITE VS MUDBASE</text>

  <!-- Appwrite column header -->
  <rect x="62" y="60" width="500" height="68" rx="12 12 0 0" fill="rgba(249,115,22,0.16)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
  <text x="312" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FB923C" text-anchor="middle">APPWRITE</text>

  <!-- Mudbase column header -->
  <rect x="638" y="60" width="500" height="68" rx="12 12 0 0" fill="rgba(0,113,254,0.16)" stroke="rgba(0,113,254,0.45)" stroke-width="1"/>
  <text x="888" y="102" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#3B82F6" text-anchor="middle">MUDBASE</text>

  <!-- Row definitions (y starts at 128, each row h=72) -->
  <!-- Row 1: Auth -->
  <rect x="62" y="128" width="500" height="72" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="98" cy="164" r="10" fill="#3B82F6" opacity="0.85"/>
  <text x="124" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Auth</text>
  <rect x="638" y="128" width="500" height="72" fill="rgba(2,6,10,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="674" cy="164" r="10" fill="#00C464" opacity="0.85"/>
  <text x="700" y="172" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Auth</text>

  <!-- Row 2: Databases/Database -->
  <rect x="62" y="200" width="500" height="72" fill="rgba(12,8,4,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="98" cy="236" r="10" fill="#3B82F6" opacity="0.85"/>
  <text x="124" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Databases</text>
  <rect x="638" y="200" width="500" height="72" fill="rgba(3,8,14,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="674" cy="236" r="10" fill="#00C464" opacity="0.85"/>
  <text x="700" y="244" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Database</text>

  <!-- Row 3: Storage -->
  <rect x="62" y="272" width="500" height="72" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="98" cy="308" r="10" fill="#3B82F6" opacity="0.85"/>
  <text x="124" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Storage</text>
  <rect x="638" y="272" width="500" height="72" fill="rgba(2,6,10,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="674" cy="308" r="10" fill="#00C464" opacity="0.85"/>
  <text x="700" y="316" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Storage</text>

  <!-- Row 4: Functions -->
  <rect x="62" y="344" width="500" height="72" fill="rgba(12,8,4,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="98" cy="380" r="10" fill="#3B82F6" opacity="0.85"/>
  <text x="124" y="388" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Functions</text>
  <rect x="638" y="344" width="500" height="72" fill="rgba(3,8,14,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="674" cy="380" r="10" fill="#00C464" opacity="0.85"/>
  <text x="700" y="388" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Functions</text>

  <!-- Row 5: (no realtime in Appwrite column) vs Realtime in Mudbase -->
  <rect x="62" y="416" width="500" height="72" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="98" cy="452" r="10" fill="#374A62" opacity="0.60"/>
  <text x="124" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#374A62" text-anchor="start">Realtime</text>
  <text x="546" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7280" text-anchor="end">limited</text>
  <rect x="638" y="416" width="500" height="72" fill="rgba(2,6,10,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="674" cy="452" r="10" fill="#00C464" opacity="0.85"/>
  <text x="700" y="460" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF" text-anchor="start">Realtime</text>

  <!-- Row 6: Payments -->
  <rect x="62" y="488" width="500" height="72" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="98" cy="524" r="10" fill="#374A62" opacity="0.60"/>
  <text x="124" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#374A62" text-anchor="start">Payments</text>
  <text x="546" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="400" fill="#6B7280" text-anchor="end">no payments primitive</text>
  <rect x="638" y="488" width="500" height="72" fill="rgba(3,8,14,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="674" cy="524" r="10" fill="#00C464" opacity="0.85"/>
  <text x="700" y="532" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#00C464" text-anchor="start">Payments (built in)</text>

  <!-- VS badge -->
  <rect x="569" y="316" width="62" height="48" rx="8" fill="rgba(20,20,30,0.96)" stroke="rgba(55,74,98,0.62)" stroke-width="1"/>
  <text x="600" y="348" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#C8D8F0" text-anchor="middle">VS</text>
</svg>
