<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Side-by-side: Appwrite services without a payments primitive versus Mudbase with payments built in alongside auth, database, storage, functions.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AA8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00C464"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#14B8A6"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="540" rx="20" fill="#020617"/>
  <rect width="1200" height="540" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="540" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="38" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" letter-spacing="3" text-anchor="start">APPWRITE VS MUDBASE</text>
  <rect x="62" y="52" width="460" height="60" rx="12 12 0 0" fill="rgba(249,115,22,0.16)" stroke="rgba(249,115,22,0.45)" stroke-width="1"/>
  <text x="292" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#FB923C" text-anchor="middle">APPWRITE</text>
  <rect x="678" y="52" width="460" height="60" rx="12 12 0 0" fill="rgba(0,113,254,0.16)" stroke="rgba(0,113,254,0.45)" stroke-width="1"/>
  <text x="908" y="90" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#3B82F6" text-anchor="middle">MUDBASE</text>
  <rect x="62" y="112" width="460" height="66" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="90" cy="145" r="8" fill="#3B82F6" opacity="0.85"/>
  <text x="112" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Auth</text>
  <rect x="62" y="178" width="460" height="66" fill="rgba(12,8,4,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="90" cy="211" r="8" fill="#3B82F6" opacity="0.85"/>
  <text x="112" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Databases</text>
  <rect x="62" y="244" width="460" height="66" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="90" cy="277" r="8" fill="#3B82F6" opacity="0.85"/>
  <text x="112" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Storage</text>
  <rect x="62" y="310" width="460" height="66" fill="rgba(12,8,4,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
