  <rect x="62" y="376" width="460" height="66" fill="rgba(8,6,3,0.88)" stroke="rgba(249,115,22,0.18)" stroke-width="1"/>
  <circle cx="90" cy="409" r="8" fill="#374A62" opacity="0.85"/>
  <text x="112" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#374A62" text-anchor="start">Payments</text>
  <text x="502" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="400" fill="#6B7280" text-anchor="end">no payments primitive</text>
  <rect x="678" y="112" width="460" height="66" fill="rgba(2,6,10,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="706" cy="145" r="8" fill="#00C464" opacity="0.85"/>
  <text x="728" y="152" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Auth</text>
  <rect x="678" y="178" width="460" height="66" fill="rgba(3,8,14,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="706" cy="211" r="8" fill="#00C464" opacity="0.85"/>
  <text x="728" y="218" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Database</text>
  <rect x="678" y="244" width="460" height="66" fill="rgba(2,6,10,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="706" cy="277" r="8" fill="#00C464" opacity="0.85"/>
  <text x="728" y="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Storage</text>
  <rect x="678" y="310" width="460" height="66" fill="rgba(3,8,14,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="706" cy="343" r="8" fill="#00C464" opacity="0.85"/>
  <text x="728" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Functions</text>
  <rect x="678" y="376" width="460" height="66" fill="rgba(2,6,10,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="706" cy="409" r="8" fill="#00C464" opacity="0.85"/>
  <text x="728" y="416" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="start">Realtime</text>
  <rect x="678" y="442" width="460" height="66" fill="rgba(3,8,14,0.90)" stroke="rgba(0,113,254,0.18)" stroke-width="1"/>
  <circle cx="706" cy="475" r="8" fill="#00C464" opacity="0.85"/>
  <text x="728" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#00C464" text-anchor="start">Payments (built in)</text>
  <rect x="569" y="270" width="62" height="52" rx="8" fill="rgba(20,20,30,0.96)" stroke="rgba(55,74,98,0.62)" stroke-width="1"/>
  <text x="600" y="310" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#C8D8F0" text-anchor="middle">VS</text>
</svg>