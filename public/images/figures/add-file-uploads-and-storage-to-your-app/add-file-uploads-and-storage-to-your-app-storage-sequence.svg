<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Access-scoped direct upload sequence: app server requests presigned URL from Mudbase Storage, passes URL to client, client uploads directly to storage backend.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AA8"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="640" rx="20" fill="#020617"/>
  <rect width="1200" height="640" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="640" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">DIRECT UPLOAD FLOW</text>

  <!-- Actor boxes -->
  <rect x="40" y="62" width="200" height="86" rx="10" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.48)" stroke-width="1.5"/>
  <text x="140" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">App Server</text>

  <rect x="310" y="62" width="240" height="86" rx="10" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.55)" stroke-width="1.5"/>
  <text x="430" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>
  <text x="430" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Storage</text>

  <rect x="624" y="62" width="200" height="86" rx="10" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.40)" stroke-width="1.5"/>
  <text x="724" y="113" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Client App</text>

  <rect x="922" y="62" width="238" height="86" rx="10" fill="rgba(55,74,98,0.18)" stroke="rgba(55,74,98,0.48)" stroke-width="1.5"/>
  <text x="1041" y="106" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Storage</text>
  <text x="1041" y="134" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Backend</text>

  <!-- Lifelines (end at canvas_h - 40 = 600) -->
  <line x1="140" y1="148" x2="140" y2="600" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="430" y1="148" x2="430" y2="600" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="724" y1="148" x2="724" y2="600" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="1041" y1="148" x2="1041" y2="600" stroke="rgba(90,140,255,0.16)" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Step 1: Request presigned URL (App Server -> Mudbase Storage) -->
  <!-- label 30 units above arrow at y=220 -->
  <rect x="180" y="164" width="226" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="293" y="183" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Request presigned URL</text>
  <line x1="145" y1="220" x2="420" y2="220" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 2: Presigned upload URL (Mudbase Storage -> App Server, return) -->
  <rect x="180" y="284" width="214" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="287" y="303" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8899BB" text-anchor="middle">Presigned upload URL</text>
  <line x1="425" y1="340" x2="150" y2="340" stroke="#6E8AA8" stroke-width="1.8" stroke-dasharray="5,4" marker-end="url(#arrow-muted)"/>

  <!-- Step 3: Upload URL to client (App Server -> Client App) -->
  <rect x="290" y="404" width="174" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="377" y="423" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">URL to client</text>
  <line x1="145" y1="460" x2="714" y2="460" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>

  <!-- Step 4: PUT file direct to storage (Client App -> Storage Backend) -->
  <rect x="752" y="504" width="206" height="28" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="855" y="523" font-family="'Courier New',Courier,monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">PUT file (direct)</text>
  <line x1="729" y1="560" x2="1031" y2="560" stroke="#0071FE" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
</svg>
