<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="1200" height="450" role="img" aria-label="SaaS data model: one user owns multiple projects; each project contains multiple tasks.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-purple" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E5BFF"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="50%" cy="20%" r="60%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.09"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="450" rx="20" fill="#020617"/>
  <rect width="1200" height="450" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="450" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="46" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">SAAS DATA MODEL</text>

  <!-- User box -->
  <rect x="480" y="70" width="240" height="64" rx="12" fill="rgba(110,91,255,0.18)" stroke="rgba(110,91,255,0.50)" stroke-width="1.5"/>
  <text x="600" y="110" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">User</text>

  <!-- Lines: User -> Project boxes -->
  <line x1="600" y1="134" x2="280" y2="202" stroke="#6E5BFF" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <line x1="600" y1="134" x2="920" y2="202" stroke="#6E5BFF" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- "owns" label below the left connector midpoint (midpoint x=440,y=168; connector at x=520 is y=151; rect top at y=183 gives 32-unit clearance) -->
  <rect x="477" y="183" width="86" height="28" rx="4" fill="rgba(2,6,23,0.88)"/>
  <text x="520" y="204" font-family="'Courier New',Courier,monospace" font-size="24" fill="#6E8AA8" text-anchor="middle">owns</text>

  <!-- Project boxes -->
  <rect x="140" y="206" width="280" height="64" rx="12" fill="rgba(0,113,254,0.16)" stroke="rgba(0,113,254,0.48)" stroke-width="1.5"/>
  <text x="280" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Project 1</text>

  <text x="600" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="36" font-weight="700" fill="#6E8AA8" text-anchor="middle">...</text>

  <rect x="780" y="206" width="280" height="64" rx="12" fill="rgba(0,113,254,0.16)" stroke="rgba(0,113,254,0.48)" stroke-width="1.5"/>
  <text x="920" y="246" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Project N</text>

  <!-- Lines: Project boxes -> Tasks -->
  <line x1="280" y1="270" x2="280" y2="334" stroke="#0071FE" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>
  <line x1="920" y1="270" x2="920" y2="334" stroke="#0071FE" stroke-width="1.8" stroke-dasharray="5,3" marker-end="url(#arrow-blue)"/>

  <!-- "contains" label beside left connector (vertical line at x=280, midpoint y=302) -->
  <rect x="294" y="289" width="132" height="28" rx="4" fill="rgba(2,6,23,0.88)"/>
  <text x="360" y="308" font-family="'Courier New',Courier,monospace" font-size="24" fill="#6E8AA8" text-anchor="middle">contains</text>

  <!-- Tasks boxes -->
  <rect x="140" y="338" width="280" height="64" rx="10" fill="rgba(8,14,36,0.90)" stroke="rgba(55,74,98,0.45)" stroke-width="1.5"/>
  <text x="280" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">Tasks</text>

  <rect x="780" y="338" width="280" height="64" rx="10" fill="rgba(8,14,36,0.90)" stroke="rgba(55,74,98,0.45)" stroke-width="1.5"/>
  <text x="920" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">Tasks</text>
</svg>
