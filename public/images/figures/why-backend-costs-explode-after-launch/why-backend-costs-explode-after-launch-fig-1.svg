<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-label="Four backend cost drivers after launch: per-seat pricing, egress, function invocations, and storage all scale independently of revenue.">
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="500" rx="20" fill="#020617"/>
  <rect width="1200" height="500" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="500" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="44" font-family="'Courier New',Courier,monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">BACKEND COST GROWTH AFTER LAUNCH</text>

  <!-- 2x2 grid. Card w=530, h=150. Columns: x=60 and x=610. Rows: y=62 and y=232. Gap col=20, row=20. Bottom of row2 = 382. Summary y=402 h=58 ends y=460. Canvas 500 -> margin 40. -->

  <!-- Card 1 top-left: PER-SEAT -->
  <rect x="60" y="62" width="530" height="150" rx="12" fill="rgba(249,115,22,0.18)" stroke="rgba(249,115,22,0.50)" stroke-width="1"/>
  <text x="325" y="104" font-family="'Courier New',Courier,monospace" font-size="26" fill="#FB923C" text-anchor="middle" letter-spacing="1">PER-SEAT</text>
  <line x1="80" y1="116" x2="570" y2="116" stroke="#FB923C" stroke-width="1" opacity="0.35"/>
  <text x="325" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#D4C8B4" text-anchor="middle">subscription cost</text>
  <text x="325" y="184" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8899BB" text-anchor="middle">rises with team size</text>

  <!-- Card 2 top-right: EGRESS -->
  <rect x="610" y="62" width="530" height="150" rx="12" fill="rgba(239,68,68,0.16)" stroke="rgba(239,68,68,0.45)" stroke-width="1"/>
  <text x="875" y="104" font-family="'Courier New',Courier,monospace" font-size="26" fill="#F87171" text-anchor="middle" letter-spacing="1">EGRESS</text>
  <line x1="630" y1="116" x2="1120" y2="116" stroke="#F87171" stroke-width="1" opacity="0.35"/>
  <text x="875" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#D4C8B4" text-anchor="middle">bandwidth out</text>
  <text x="875" y="184" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8899BB" text-anchor="middle">ambushes you at launch</text>

  <!-- Card 3 bottom-left: INVOCATIONS -->
  <rect x="60" y="232" width="530" height="150" rx="12" fill="rgba(168,85,247,0.14)" stroke="rgba(168,85,247,0.42)" stroke-width="1"/>
  <text x="325" y="274" font-family="'Courier New',Courier,monospace" font-size="26" fill="#C084FC" text-anchor="middle" letter-spacing="1">INVOCATIONS</text>
  <line x1="80" y1="286" x2="570" y2="286" stroke="#C084FC" stroke-width="1" opacity="0.35"/>
  <text x="325" y="322" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#D4C8B4" text-anchor="middle">function invocations</text>
  <text x="325" y="354" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8899BB" text-anchor="middle">billed per call</text>

  <!-- Card 4 bottom-right: STORAGE -->
  <rect x="610" y="232" width="530" height="150" rx="12" fill="rgba(234,179,8,0.16)" stroke="rgba(234,179,8,0.44)" stroke-width="1"/>
  <text x="875" y="274" font-family="'Courier New',Courier,monospace" font-size="26" fill="#FCD34D" text-anchor="middle" letter-spacing="1">STORAGE</text>
  <line x1="630" y1="286" x2="1120" y2="286" stroke="#FCD34D" stroke-width="1" opacity="0.35"/>
  <text x="875" y="322" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#D4C8B4" text-anchor="middle">grows with usage</text>
  <text x="875" y="354" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#8899BB" text-anchor="middle">never shrinks</text>

  <!-- Summary bar -->
  <rect x="60" y="402" width="1080" height="58" rx="10" fill="rgba(5,3,18,0.80)" stroke="rgba(55,74,98,0.35)" stroke-width="1"/>
  <text x="600" y="438" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">the bill rises with traffic, not with revenue</text>
</svg>
