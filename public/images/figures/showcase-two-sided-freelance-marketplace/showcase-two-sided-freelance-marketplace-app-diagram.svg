<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-label="Two-sided freelance marketplace on Mudbase: client posts listings, freelancer submits proposals, anonymous auth loads public listings.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="560" rx="20" fill="#020617"/>
  <rect width="1200" height="560" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="560" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>

  <text x="60" y="44" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">FREELANCE MARKETPLACE ARCHITECTURE</text>

  <!-- Left column: 3 actors -->
  <!-- Client -->
  <rect x="40" y="72" width="280" height="100" rx="12" fill="rgba(110,91,255,0.16)" stroke="rgba(110,91,255,0.44)" stroke-width="1.5"/>
  <text x="180" y="116" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Client</text>
  <text x="180" y="148" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">posts listings</text>

  <!-- Freelancer -->
  <rect x="40" y="218" width="280" height="100" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.42)" stroke-width="1.5"/>
  <text x="180" y="262" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">Freelancer</text>
  <text x="180" y="294" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">browses listings</text>

  <!-- Anonymous Session -->
  <rect x="40" y="378" width="280" height="100" rx="12" fill="rgba(249,115,22,0.12)" stroke="rgba(249,115,22,0.38)" stroke-width="1.5"/>
  <text x="180" y="418" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FB923C" text-anchor="middle">Anonymous</text>
  <text x="180" y="450" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">loads listings</text>

  <!-- Arrows to Mudbase -->
  <line x1="320" y1="122" x2="452" y2="250" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="268" x2="452" y2="268" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="320" y1="428" x2="452" y2="338" stroke="#F97316" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arrow-orange)"/>

  <!-- Center: Mudbase hub -->
  <rect x="452" y="162" width="260" height="210" rx="16" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.55)" stroke-width="2"/>
  <text x="582" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="32" font-weight="700" fill="#FFFFFF" text-anchor="middle">Mudbase</text>

  <!-- Service chips inside hub (all 24pt, Auth widened for clearance) -->
  <rect x="466" y="252" width="100" height="44" rx="8" fill="rgba(110,91,255,0.20)" stroke="rgba(110,91,255,0.45)" stroke-width="1"/>
  <text x="516" y="281" font-family="'Courier New', Courier, monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Auth</text>

  <rect x="578" y="252" width="90" height="44" rx="8" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.45)" stroke-width="1"/>
  <text x="623" y="281" font-family="'Courier New', Courier, monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">DB</text>

  <rect x="466" y="308" width="202" height="44" rx="8" fill="rgba(20,184,166,0.18)" stroke="rgba(20,184,166,0.42)" stroke-width="1"/>
  <text x="567" y="337" font-family="'Courier New', Courier, monospace" font-size="24" fill="#C8D8F0" text-anchor="middle">Realtime</text>

  <!-- Arrow: Mudbase -> Collections (stores label 16 units above arrow) -->
  <line x1="712" y1="267" x2="808" y2="267" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="718" y="220" width="84" height="30" rx="4" fill="rgba(2,6,23,0.88)"/>
  <text x="760" y="242" font-family="'Courier New', Courier, monospace" font-size="24" fill="#6E8AA8" text-anchor="middle">stores</text>

  <!-- Right: Collection boxes -->
  <!-- listings -->
  <rect x="808" y="62" width="352" height="150" rx="12" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.36)" stroke-width="1.5"/>
  <text x="984" y="106" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">listings</text>
  <text x="984" y="138" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">title, budget</text>
  <text x="984" y="166" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">clientId, status</text>

  <!-- proposals -->
  <rect x="808" y="228" width="352" height="150" rx="12" fill="rgba(0,113,254,0.12)" stroke="rgba(0,113,254,0.36)" stroke-width="1.5"/>
  <text x="984" y="272" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">proposals</text>
  <text x="984" y="304" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">listingId</text>
  <text x="984" y="332" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">proposedRate</text>

  <!-- messages -->
  <rect x="808" y="394" width="352" height="126" rx="12" fill="rgba(20,184,166,0.10)" stroke="rgba(20,184,166,0.34)" stroke-width="1.5"/>
  <text x="984" y="438" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="700" fill="#FFFFFF" text-anchor="middle">messages</text>
  <text x="984" y="470" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle">senderId, content</text>
</svg>
