<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Webhook maintenance surface: signature check, idempotency, ordering guard, handler, dead-letter queue. All are guaranteed to trigger with enough traffic.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00C464"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="600" rx="20" fill="#020617"/>
  <rect width="1200" height="600" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="600" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="45" font-family="'Courier New', Courier, monospace" font-size="26" fill="#8899BB" letter-spacing="2" text-anchor="start">WEBHOOK PROCESSING PIPELINE</text>

  <!-- Top row: Inbound, Verify Signature, Idempotency Check -->
  <!-- Node 1: Inbound Webhook (w=320, x=40 for 40-unit left margin) -->
  <rect x="40" y="68" width="320" height="96" rx="12" fill="rgba(55,74,98,0.30)" stroke="rgba(55,74,98,0.55)" stroke-width="1"/>
  <text x="200" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Inbound Webhook</text>
  <text x="200" y="136" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">POST from provider</text>

  <!-- Arrow: 1 -> 2 -->
  <line x1="360" y1="116" x2="438" y2="116" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 2: Verify Signature (w=320, x=440) -->
  <rect x="440" y="68" width="320" height="96" rx="12" fill="rgba(249,115,22,0.16)" stroke="rgba(249,115,22,0.48)" stroke-width="1"/>
  <text x="600" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Verify Signature</text>
  <text x="600" y="136" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">shared secret</text>

  <!-- Arrow: 2 -> 3 -->
  <line x1="760" y1="116" x2="838" y2="116" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Node 3: Idempotency Check (w=320, x=840) -->
  <rect x="840" y="68" width="320" height="96" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1"/>
  <text x="1000" y="104" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Idempotency Check</text>
  <text x="1000" y="136" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">can arrive twice</text>

  <!-- Arrow: down from node 3 to middle row (no label - "pass checks" not grounded) -->
  <path d="M 1000 164 L 1000 212 L 200 212 L 200 268" fill="none" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <!-- Bottom row: Ordering Guard, Handler, Dead-letter -->
  <!-- Node 4: Order Check (w=320, x=40) -->
  <rect x="40" y="270" width="320" height="96" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1"/>
  <text x="200" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Order Check</text>
  <text x="200" y="338" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">ordering</text>

  <!-- Arrow: 4 -> 5 -->
  <line x1="360" y1="318" x2="438" y2="318" stroke="#00C464" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Node 5: Handler + Action (w=320, x=440) -->
  <rect x="440" y="270" width="320" height="96" rx="12" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.44)" stroke-width="1"/>
  <text x="600" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Handler + Action</text>
  <text x="600" y="338" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">process the event</text>

  <!-- Arrow: 5 -> 6 -->
  <line x1="760" y1="318" x2="838" y2="318" stroke="#F97316" stroke-width="2" marker-end="url(#arrow-orange)"/>

  <!-- Node 6: Dead-letter Queue (w=320, x=840) -->
  <rect x="840" y="270" width="320" height="96" rx="12" fill="rgba(220,64,64,0.14)" stroke="rgba(220,64,64,0.44)" stroke-width="1"/>
  <text x="1000" y="306" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dead-letter Queue</text>
  <text x="1000" y="338" font-family="'Courier New', Courier, monospace" font-size="24" fill="#8899BB" text-anchor="middle" letter-spacing="1">inspect and replay</text>

  <!-- Processed badge -->
  <rect x="508" y="420" width="184" height="56" rx="28" fill="rgba(0,196,74,0.20)" stroke="rgba(0,196,74,0.55)" stroke-width="1"/>
  <text x="600" y="454" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="700" fill="#00C464" text-anchor="middle">Processed</text>
  <line x1="600" y1="366" x2="600" y2="416" stroke="#00C464" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Caption bar -->
  <rect x="52" y="496" width="1096" height="48" rx="8" fill="rgba(5,3,18,0.80)" stroke="rgba(55,74,98,0.35)" stroke-width="1"/>
  <text x="600" y="527" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#6E8AA8" text-anchor="middle">all of these are guaranteed to happen given enough traffic and time</text>
</svg>
