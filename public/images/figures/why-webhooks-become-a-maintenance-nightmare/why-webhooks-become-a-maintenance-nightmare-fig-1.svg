<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 510" width="1200" height="510" role="img" aria-label="Webhook maintenance surface: signature check, idempotency, ordering guard, handler, dead-letter queue. All are guaranteed to trigger with enough traffic.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
    <marker id="arrow-muted" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#6E8AA8"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#00C464"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#F97316"/>
    </marker>
    <marker id="arrow-teal" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#14B8A6"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="510" rx="20" fill="#020617"/>
  <rect width="1200" height="510" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="510" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="38" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" letter-spacing="3" text-anchor="start">WEBHOOK MAINTENANCE SURFACE</text>
  <rect x="60" y="60" width="280" height="100" rx="12" fill="rgba(55,74,98,0.30)" stroke="rgba(55,74,98,0.55)" stroke-width="1"/>
  <text x="200" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Inbound Webhook</text>
  <rect x="114" y="126" width="172" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="200" y="144" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" text-anchor="middle" letter-spacing="1">POST from provider</text>
  <rect x="460" y="60" width="280" height="100" rx="12" fill="rgba(249,115,22,0.16)" stroke="rgba(249,115,22,0.48)" stroke-width="1"/>
  <text x="600" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Verify Signature</text>
  <rect x="475" y="126" width="250" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="600" y="144" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" text-anchor="middle" letter-spacing="1">check against shared secret</text>
  <rect x="860" y="60" width="280" height="100" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1"/>
  <text x="1000" y="92" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Idempotency Check</text>
  <rect x="923" y="126" width="154" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="1000" y="144" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" text-anchor="middle" letter-spacing="1">can arrive twice</text>
  <rect x="60" y="260" width="280" height="100" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.44)" stroke-width="1"/>
  <text x="200" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Ordering Guard</text>
  <rect x="110" y="326" width="180" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="200" y="344" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" text-anchor="middle" letter-spacing="1">out-of-order events</text>
  <rect x="460" y="260" width="280" height="100" rx="12" fill="rgba(0,196,74,0.14)" stroke="rgba(0,196,74,0.44)" stroke-width="1"/>
  <text x="600" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Handler + Action</text>
  <rect x="519" y="326" width="163" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="600" y="344" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" text-anchor="middle" letter-spacing="1">process the event</text>
  <rect x="860" y="260" width="280" height="100" rx="12" fill="rgba(220,64,64,0.14)" stroke="rgba(220,64,64,0.44)" stroke-width="1"/>
  <text x="1000" y="292" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">Dead-letter Queue</text>
  <rect x="914" y="326" width="172" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="1000" y="344" font-family="'Courier New', Courier, monospace" font-size="14" fill="#8899BB" text-anchor="middle" letter-spacing="1">inspect and replay</text>
  <line x1="340" y1="110" x2="456" y2="110" stroke="#0071FE" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-blue)"/>
  <line x1="740" y1="110" x2="856" y2="110" stroke="#0071FE" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-blue)"/>
  <path d="M 1000 160 L 1000 210 L 200 210 L 200 256" fill="none" stroke="#0071FE" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <rect x="545" y="182" width="111" height="22" rx="4" fill="rgba(2,6,23,0.92)"/>
  <text x="600" y="200" font-family="'Courier New', Courier, monospace" font-size="14" fill="#6E8AA8" text-anchor="middle" letter-spacing="1">pass checks</text>
  <line x1="340" y1="310" x2="456" y2="310" stroke="#00C464" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-green)"/>
  <line x1="740" y1="310" x2="856" y2="310" stroke="#DC4040" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-orange)"/>
  <rect x="545" y="402" width="110" height="36" rx="18" fill="rgba(0,196,74,0.20)" stroke="rgba(0,196,74,0.55)" stroke-width="1"/>
  <text x="600" y="426" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="700" fill="#00C464" text-anchor="middle">Processed</text>
  <line x1="600" y1="364" x2="600" y2="398" stroke="#00C464" stroke-width="2" stroke-dasharray="none" marker-end="url(#arrow-green)"/>
  <rect x="52" y="458" width="1096" height="36" rx="8" fill="rgba(5,3,18,0.80)" stroke="rgba(55,74,98,0.35)" stroke-width="1"/>
  <text x="600" y="482" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="600" fill="#6E8AA8" text-anchor="middle">all of them are guaranteed to happen given enough traffic and time</text>
</svg>