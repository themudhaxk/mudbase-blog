<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="Four-way comparison of Firebase, Supabase, Appwrite, and PocketBase across database, hosting, auth, functions, and payments.">
  <rect width="1200" height="680" rx="20" fill="#020617"/>
  <rect width="1200" height="680" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">FOUR-WAY CAPABILITY MATRIX</text>

  <!-- Label col: x=40 w=160 right=200. 4 product cols 240px each: 200,440,680,920 right=1160 -->

  <!-- Headers y=60 h=68 -->
  <rect x="40" y="60" width="160" height="68" rx="8" fill="rgba(10,12,20,0.7)" stroke="rgba(55,74,98,0.2)" stroke-width="1"/>
  <rect x="200" y="60" width="240" height="68" rx="8" fill="rgba(255,195,0,0.15)" stroke="rgba(255,195,0,0.4)" stroke-width="1.5"/>
  <text x="320" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFC300" text-anchor="middle">Firebase</text>
  <rect x="440" y="60" width="240" height="68" rx="8" fill="rgba(62,207,142,0.15)" stroke="rgba(62,207,142,0.4)" stroke-width="1.5"/>
  <text x="560" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#3ECF8E" text-anchor="middle">Supabase</text>
  <rect x="680" y="60" width="240" height="68" rx="8" fill="rgba(240,82,82,0.15)" stroke="rgba(240,82,82,0.4)" stroke-width="1.5"/>
  <text x="800" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#F05252" text-anchor="middle">Appwrite</text>
  <rect x="920" y="60" width="240" height="68" rx="8" fill="rgba(249,115,22,0.15)" stroke="rgba(249,115,22,0.4)" stroke-width="1.5"/>
  <text x="1040" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FB923C" text-anchor="middle">PocketBase</text>

  <!-- Row: Database y=128 h=100 -->
  <rect x="40" y="128" width="160" height="100" fill="rgba(10,12,20,0.6)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="60" y="186" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Database</text>
  <rect x="200" y="128" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="320" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FFC300" text-anchor="middle">NoSQL</text>
  <rect x="440" y="128" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="560" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Postgres</text>
  <rect x="680" y="128" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="800" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Documents</text>
  <rect x="920" y="128" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="1040" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">SQLite</text>

  <!-- Row: Hosting y=228 h=100 -->
  <rect x="40" y="228" width="160" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="60" y="286" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Hosting</text>
  <rect x="200" y="228" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="320" y="286" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Fully managed</text>
  <rect x="440" y="228" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="560" y="278" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0" text-anchor="middle">Managed</text>
  <text x="560" y="306" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#6E8AA8" text-anchor="middle">or self-hosted</text>
  <rect x="680" y="228" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="800" y="286" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Self-hosted</text>
  <rect x="920" y="228" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="1040" y="286" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Self-hosted</text>

  <!-- Row: Auth y=328 h=100 -->
  <rect x="40" y="328" width="160" height="100" fill="rgba(10,12,20,0.6)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="60" y="386" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Auth</text>
  <rect x="200" y="328" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="320" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Email + social</text>
  <rect x="440" y="328" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="560" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Email + social</text>
  <rect x="680" y="328" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="800" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Email + OAuth</text>
  <rect x="920" y="328" width="240" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="1040" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0" text-anchor="middle">Email + OAuth</text>

  <!-- Row: Functions y=428 h=100 -->
  <rect x="40" y="428" width="160" height="100" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="60" y="486" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Functions</text>
  <rect x="200" y="428" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="320" y="486" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#FFC300" text-anchor="middle">Cloud Functions</text>
  <rect x="440" y="428" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="560" y="486" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0" text-anchor="middle">Edge Functions</text>
  <rect x="680" y="428" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="800" y="486" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#C8D8F0" text-anchor="middle">Multi-runtime</text>
  <rect x="920" y="428" width="240" height="100" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1"/>
  <text x="1040" y="486" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">None built in</text>

  <!-- Row: Payments y=528 h=112 -->
  <rect x="40" y="528" width="160" height="112" fill="rgba(10,12,20,0.5)" stroke="rgba(55,74,98,0.18)" stroke-width="1" rx="0 0 6 6"/>
  <text x="60" y="592" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">Payments</text>
  <rect x="200" y="528" width="240" height="112" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1" rx="0 0 6 6"/>
  <text x="320" y="592" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>
  <rect x="440" y="528" width="240" height="112" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1" rx="0 0 6 6"/>
  <text x="560" y="592" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>
  <rect x="680" y="528" width="240" height="112" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1" rx="0 0 6 6"/>
  <text x="800" y="592" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>
  <rect x="920" y="528" width="240" height="112" fill="rgba(10,12,20,0.45)" stroke="rgba(55,74,98,0.18)" stroke-width="1" rx="0 0 6 6"/>
  <text x="1040" y="592" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C" text-anchor="middle">Not included</text>
</svg>
