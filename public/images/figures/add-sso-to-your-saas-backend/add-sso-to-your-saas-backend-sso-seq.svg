<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="SSO login flow: user clicks sign in, app redirects to identity provider via OIDC, identity provider returns ID token, Mudbase validates and issues a JWT session.">
  <defs>
    <marker id="arr-fwd" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#60A5FA"/>
    </marker>
    <marker id="arr-ret" markerWidth="9" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 9 3, 0 6" fill="#00C464"/>
    </marker>
  </defs>
  <rect width="1200" height="520" rx="20" fill="#020617"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">SSO LOGIN FLOW</text>

  <!-- 4 actors: User x=40 w=130 center=105, App x=300 w=130 center=365, IdP x=540 w=220 center=650, Mudbase x=870 w=290 center=1015 -->
  <rect x="40" y="58" width="130" height="68" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <text x="105" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">User</text>

  <rect x="300" y="58" width="130" height="68" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <text x="365" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="600" fill="#C8D8F0" text-anchor="middle">App</text>

  <rect x="540" y="58" width="220" height="68" rx="10" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <text x="650" y="92" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">Identity</text>
  <text x="650" y="118" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="600" fill="#C8D8F0" text-anchor="middle">Provider</text>

  <rect x="870" y="58" width="290" height="68" rx="10" fill="rgba(0,113,254,0.18)" stroke="#0071FE" stroke-width="2"/>
  <text x="1015" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="600" fill="#60A5FA" text-anchor="middle">Mudbase</text>

  <!-- Lifelines: actor boxes end at y=126; lifelines y=126 to y=480 -->
  <line x1="105" y1="126" x2="105" y2="480" stroke="rgba(55,74,98,0.4)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="365" y1="126" x2="365" y2="480" stroke="rgba(55,74,98,0.4)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="650" y1="126" x2="650" y2="480" stroke="rgba(55,74,98,0.4)" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="1015" y1="126" x2="1015" y2="480" stroke="rgba(55,74,98,0.4)" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Messages: arrows at y=194,260,326,392,458. Labels 28 units above each arrow. No pill rects. -->

  <!-- Msg 1: User->App "Sign in" arrow y=194, label y=166 (28 above) -->
  <text x="235" y="166" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#60A5FA" text-anchor="middle">Sign in</text>
  <line x1="105" y1="194" x2="357" y2="194" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Msg 2: App->IdP "OIDC redirect" arrow y=260, label y=232 -->
  <text x="508" y="232" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#60A5FA" text-anchor="middle">OIDC redirect</text>
  <line x1="365" y1="260" x2="642" y2="260" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Msg 3: IdP->App "ID token" arrow y=326, label y=298 (dashed return) -->
  <text x="508" y="298" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#00C464" text-anchor="middle">ID token</text>
  <line x1="650" y1="326" x2="373" y2="326" stroke="#00C464" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-ret)"/>

  <!-- Msg 4: App->Mudbase "Validate token" arrow y=392, label y=364 -->
  <text x="690" y="364" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#60A5FA" text-anchor="middle">Validate token</text>
  <line x1="365" y1="392" x2="1007" y2="392" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr-fwd)"/>

  <!-- Msg 5: Mudbase->App "JWT session" arrow y=458, label y=430 (dashed return) -->
  <text x="690" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#00C464" text-anchor="middle">JWT session</text>
  <line x1="1015" y1="458" x2="373" y2="458" stroke="#00C464" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-ret)"/>
</svg>
