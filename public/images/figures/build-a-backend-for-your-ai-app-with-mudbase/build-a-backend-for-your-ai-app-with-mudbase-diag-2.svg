<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Three-step data workflow: create schema in a collection, write data via POST, read data with GET.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="20" fill="#020617"/>
  <rect width="1200" height="340" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">DATA WORKFLOW</text>

  <!-- 3 boxes: equal width, 40px margins, 60px gaps -->
  <!-- Box 1: x=40, w=333, center=206, right=373 -->
  <!-- Box 2: x=433, w=333, center=599, right=766 -->
  <!-- Box 3: x=826, w=334, center=993, right=1160 -->
  <!-- Boxes: y=72 h=220. Circle at cy=120 r=26. Title y=174. Subtext y=212. Box bottom=292. -->

  <!-- Box 1: Create Schema -->
  <rect x="40" y="72" width="333" height="220" rx="14" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.52)" stroke-width="2"/>
  <circle cx="206" cy="120" r="26" fill="#0071FE"/>
  <text x="206" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
  <text x="206" y="174" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">Create Schema</text>
  <text x="206" y="212" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">collections and fields</text>

  <!-- Arrow 1->2 -->
  <line x1="373" y1="182" x2="433" y2="182" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box 2: Write Data -->
  <rect x="433" y="72" width="333" height="220" rx="14" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.38)" stroke-width="2"/>
  <circle cx="599" cy="120" r="26" fill="rgba(0,113,254,0.70)"/>
  <text x="599" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
  <text x="599" y="174" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">Write Data</text>
  <text x="599" y="212" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">POST to collection API</text>

  <!-- Arrow 2->3 -->
  <line x1="766" y1="182" x2="826" y2="182" stroke="#60A5FA" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Box 3: Read Data -->
  <rect x="826" y="72" width="334" height="220" rx="14" fill="rgba(0,196,74,0.12)" stroke="rgba(0,196,74,0.38)" stroke-width="2"/>
  <circle cx="993" cy="120" r="26" fill="rgba(0,196,74,0.70)"/>
  <text x="993" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="26" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
  <text x="993" y="174" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">Read Data</text>
  <text x="993" y="212" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">GET records in frontend</text>
</svg>
