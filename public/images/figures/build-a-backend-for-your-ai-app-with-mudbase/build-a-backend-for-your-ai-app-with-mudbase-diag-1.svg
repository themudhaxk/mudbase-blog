<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-label="Five-step AI app backend setup: create a Mudbase project, define a collection, store data, read data, then connect the frontend.">
  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#0071FE"/>
    </marker>
  </defs>
  <radialGradient id="bg-glow" cx="80%" cy="15%" r="50%" gradientUnits="objectBoundingBox">
    <stop offset="0%" stop-color="#0071FE" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#0071FE" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="700" rx="20" fill="#020617"/>
  <rect width="1200" height="700" rx="20" fill="url(#bg-glow)"/>
  <rect width="1200" height="700" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="48" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">AI APP BACKEND SETUP</text>
  <!-- Step boxes: x=50 w=1110 right=1160 (40px margin). Centered text at x=630. -->
  <!-- Step 1 -->
  <rect x="50" y="68" width="1110" height="100" rx="12" fill="rgba(0,113,254,0.20)" stroke="rgba(0,113,254,0.52)" stroke-width="1.5"/>
  <circle cx="94" cy="118" r="22" fill="rgba(0,113,254,0.50)"/>
  <text x="94" y="126" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">1</text>
  <text x="630" y="107" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FFF" text-anchor="middle">Mudbase Project</text>
  <text x="630" y="143" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">sign up and create a project from the dashboard</text>
  <!-- Arrow 1->2 -->
  <line x1="630" y1="170" x2="630" y2="190" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 2 -->
  <rect x="50" y="198" width="1110" height="100" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.38)" stroke-width="1.5"/>
  <circle cx="94" cy="248" r="22" fill="rgba(0,113,254,0.40)"/>
  <text x="94" y="256" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">2</text>
  <text x="630" y="237" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FFF" text-anchor="middle">Create Collection</text>
  <text x="630" y="273" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">define your data schema</text>
  <!-- Arrow 2->3 -->
  <line x1="630" y1="300" x2="630" y2="320" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 3 -->
  <rect x="50" y="328" width="1110" height="100" rx="12" fill="rgba(0,113,254,0.14)" stroke="rgba(0,113,254,0.38)" stroke-width="1.5"/>
  <circle cx="94" cy="378" r="22" fill="rgba(0,113,254,0.40)"/>
  <text x="94" y="386" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">3</text>
  <text x="630" y="367" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FFF" text-anchor="middle">Store Data</text>
  <text x="630" y="403" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">write records via the REST API</text>
  <!-- Arrow 3->4 -->
  <line x1="630" y1="430" x2="630" y2="450" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 4 -->
  <rect x="50" y="458" width="1110" height="100" rx="12" fill="rgba(0,113,254,0.12)" stroke="rgba(0,113,254,0.36)" stroke-width="1.5"/>
  <circle cx="94" cy="508" r="22" fill="rgba(0,113,254,0.38)"/>
  <text x="94" y="516" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#FFF" text-anchor="middle">4</text>
  <text x="630" y="497" font-family="system-ui,-apple-system,sans-serif" font-size="30" font-weight="700" fill="#FFF" text-anchor="middle">Read Data</text>
  <text x="630" y="533" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#6E8AA8" text-anchor="middle">query records in your app</text>
  <!-- Arrow 4->5 -->
  <line x1="630" y1="560" x2="630" y2="580" stroke="#0071FE" stroke-width="2.5" marker-end="url(#arrow-blue)"/>
  <!-- Step 5 -->
  <rect x="50" y="588" width="1110" height="68" rx="12" fill="rgba(110,91,255,0.14)" stroke="rgba(110,91,255,0.38)" stroke-width="1.5"/>
  <text x="630" y="629" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#FFF" text-anchor="middle">Connect your AI-coded frontend</text>
</svg>
