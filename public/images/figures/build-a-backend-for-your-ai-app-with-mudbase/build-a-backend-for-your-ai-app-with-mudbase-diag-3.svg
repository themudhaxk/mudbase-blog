<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Request chain: frontend sends HTTP request to Mudbase API, which queries the database; results return as response.">
  <defs>
    <marker id="arr-fwd" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60A5FA"/>
    </marker>
    <marker id="arr-ret" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00C464"/>
    </marker>
  </defs>
  <rect width="1200" height="340" rx="20" fill="#020617"/>
  <rect width="1200" height="340" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">REQUEST CHAIN</text>

  <!-- 3 boxes with 180px gaps, 40px left/right margins -->
  <!-- Total = 1200 - 80 - 360 = 760 for boxes -> each ~253px -->
  <!-- Box 1: x=40, w=253, right=293, center x=166 -->
  <!-- Gap 1: x=293 to x=473 (180px), center=383 -->
  <!-- Box 2: x=473, w=254, right=727, center x=600 -->
  <!-- Gap 2: x=727 to x=907 (180px), center=817 -->
  <!-- Box 3: x=907, w=253, right=1160, center x=1033 -->

  <!-- Boxes y=116, h=140, center y=186 -->

  <!-- Box 1: Frontend -->
  <rect x="40" y="116" width="253" height="140" rx="12" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <text x="166" y="194" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="#C8D8F0" text-anchor="middle">Frontend</text>

  <!-- Box 2: Mudbase API -->
  <rect x="473" y="116" width="254" height="140" rx="12" fill="rgba(0,113,254,0.20)" stroke="#0071FE" stroke-width="2"/>
  <text x="600" y="186" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#60A5FA" text-anchor="middle">Mudbase</text>
  <text x="600" y="224" font-family="system-ui,-apple-system,sans-serif" font-size="28" font-weight="700" fill="#60A5FA" text-anchor="middle">API</text>

  <!-- Box 3: Database -->
  <rect x="907" y="116" width="253" height="140" rx="12" fill="rgba(0,196,100,0.12)" stroke="rgba(0,196,100,0.40)" stroke-width="1.5"/>
  <text x="1033" y="194" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="#00C464" text-anchor="middle">Database</text>

  <!-- Forward arrows (above boxes center line) at y=166 -->
  <!-- Gap 1 forward arrow: x=293 to x=473, at y=166 -->
  <line x1="293" y1="166" x2="473" y2="166" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <!-- Label above arrow, in gap, 14px above line -->
  <text x="383" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#60A5FA" text-anchor="middle">HTTP request</text>

  <!-- Gap 2 forward arrow: x=727 to x=907, at y=166 -->
  <line x1="727" y1="166" x2="907" y2="166" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr-fwd)"/>
  <text x="817" y="152" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#60A5FA" text-anchor="middle">query</text>

  <!-- Return arrows (below boxes center line) at y=236 (dashed) -->
  <!-- Gap 2 return arrow: x=907 to x=727, at y=236 -->
  <line x1="907" y1="236" x2="727" y2="236" stroke="#00C464" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-ret)"/>
  <text x="817" y="280" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#00C464" text-anchor="middle">results</text>

  <!-- Gap 1 return arrow: x=473 to x=293, at y=236 -->
  <line x1="473" y1="236" x2="293" y2="236" stroke="#00C464" stroke-width="2" stroke-dasharray="7,4" marker-end="url(#arr-ret)"/>
  <text x="383" y="280" font-family="system-ui,-apple-system,sans-serif" font-size="24" fill="#00C464" text-anchor="middle">response</text>
</svg>
