<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="1200" height="520" role="img" aria-label="PocketBase versus Mudbase: runtime, hosting, database, and payments comparison.">
  <rect width="1200" height="520" rx="20" fill="#020617"/>
  <rect width="1200" height="520" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="46" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">DEPLOYMENT MODEL COMPARISON</text>

  <!-- PocketBase col x=40 w=510 right=550; VS gap x=550-650 (100px); Mudbase col x=650 w=510 right=1160 -->

  <!-- Column headers y=60 h=68 -->
  <rect x="40" y="60" width="510" height="68" rx="10" fill="rgba(249,115,22,0.18)" stroke="rgba(249,115,22,0.45)" stroke-width="1.5"/>
  <text x="295" y="104" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="#FB923C" text-anchor="middle">PocketBase</text>
  <rect x="563" y="74" width="74" height="40" rx="8" fill="rgba(20,20,30,0.96)" stroke="rgba(55,74,98,0.62)" stroke-width="1"/>
  <text x="600" y="100" font-family="system-ui,-apple-system,sans-serif" font-size="24" font-weight="700" fill="#C8D8F0" text-anchor="middle">VS</text>
  <rect x="650" y="60" width="510" height="68" rx="10" fill="rgba(0,113,254,0.18)" stroke="rgba(0,113,254,0.45)" stroke-width="1.5"/>
  <text x="905" y="104" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="700" fill="#60A5FA" text-anchor="middle">Mudbase</text>

  <!-- 4 rows h=88 starting y=128. Row bottoms: 216, 304, 392, 480. ViewBox h=520 -> bottom padding=520-480=40px. -->

  <!-- Row 1: RUNTIME y=128 h=88 -->
  <rect x="40" y="128" width="510" height="88" fill="rgba(12,10,4,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="650" y="128" width="510" height="88" fill="rgba(4,8,20,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="60" y="156" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">RUNTIME</text>
  <text x="670" y="156" font-family="'Courier New',Courier,monospace" font-size="24" fill="#4a8a9a" letter-spacing="1">RUNTIME</text>
  <text x="60" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0">Single Go binary</text>
  <text x="670" y="200" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0">Fully managed</text>

  <!-- Row 2: HOSTING y=216 h=88 -->
  <rect x="40" y="216" width="510" height="88" fill="rgba(16,14,6,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="650" y="216" width="510" height="88" fill="rgba(8,12,26,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="60" y="244" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">HOSTING</text>
  <text x="670" y="244" font-family="'Courier New',Courier,monospace" font-size="24" fill="#4a8a9a" letter-spacing="1">HOSTING</text>
  <text x="60" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0">You host the server</text>
  <text x="670" y="288" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0">No server to run</text>

  <!-- Row 3: DATABASE y=304 h=88 -->
  <rect x="40" y="304" width="510" height="88" fill="rgba(12,10,4,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <rect x="650" y="304" width="510" height="88" fill="rgba(4,8,20,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1"/>
  <text x="60" y="332" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">DATABASE</text>
  <text x="670" y="332" font-family="'Courier New',Courier,monospace" font-size="24" fill="#4a8a9a" letter-spacing="1">DATABASE</text>
  <text x="60" y="376" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0">SQLite (embedded)</text>
  <text x="670" y="376" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#C8D8F0">Document database</text>

  <!-- Row 4: PAYMENTS y=392 h=88 -->
  <rect x="40" y="392" width="510" height="88" fill="rgba(12,10,4,0.88)" stroke="rgba(55,74,98,0.22)" stroke-width="1" rx="0 0 8 8"/>
  <rect x="650" y="392" width="510" height="88" fill="rgba(0,196,100,0.08)" stroke="rgba(0,196,100,0.35)" stroke-width="1" rx="0 0 8 8"/>
  <text x="60" y="420" font-family="'Courier New',Courier,monospace" font-size="24" fill="#8A6A5A" letter-spacing="1">PAYMENTS</text>
  <text x="670" y="420" font-family="'Courier New',Courier,monospace" font-size="24" fill="#4a8a9a" letter-spacing="1">PAYMENTS</text>
  <text x="60" y="464" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#FB923C">Not included</text>
  <text x="670" y="464" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#00C464">Built in</text>
</svg>
