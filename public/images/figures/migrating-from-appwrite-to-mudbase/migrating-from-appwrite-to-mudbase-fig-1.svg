<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="1200" height="480" role="img" aria-label="Four-step migration flow from Appwrite to Mudbase: open Import Data, connect to Appwrite with credentials, swap the SDK, then verify in staging.">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#60A5FA"/>
    </marker>
  </defs>
  <rect width="1200" height="480" rx="20" fill="#020617"/>
  <rect width="1200" height="480" rx="20" fill="none" stroke="rgba(90,140,255,0.25)" stroke-width="1"/>
  <text x="60" y="48" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8899BB" letter-spacing="3">MIGRATION STEPS</text>
  <!-- Step 1: top left -->
  <rect x="60" y="72" width="500" height="160" rx="12" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <circle cx="104" cy="116" r="24" fill="#0071FE"/>
  <text x="104" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="150" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="start">Open Import Data</text>
  <text x="150" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">Project Details &gt;</text>
  <text x="150" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">Import data</text>
  <!-- Arrow right -->
  <line x1="560" y1="152" x2="640" y2="152" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 2: top right -->
  <rect x="640" y="72" width="500" height="160" rx="12" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <circle cx="684" cy="116" r="24" fill="#0071FE"/>
  <text x="684" y="124" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="730" y="108" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="start">Connect to Appwrite</text>
  <text x="730" y="146" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">Enter endpoint,</text>
  <text x="730" y="178" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">project ID + API key</text>
  <!-- Arrow down right to left -->
  <line x1="890" y1="232" x2="890" y2="286" stroke="#60A5FA" stroke-width="2"/>
  <line x1="890" y1="286" x2="310" y2="286" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 3: bottom left -->
  <rect x="60" y="300" width="500" height="140" rx="12" fill="rgba(16,24,44,0.96)" stroke="rgba(55,74,98,0.55)" stroke-width="1.5"/>
  <circle cx="104" cy="340" r="24" fill="#0071FE"/>
  <text x="104" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="150" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="start">Swap the SDK</text>
  <text x="150" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">Replace calls with</text>
  <text x="150" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#60A5FA" text-anchor="start">mudbase-sdk</text>
  <!-- Arrow right -->
  <line x1="560" y1="370" x2="640" y2="370" stroke="#60A5FA" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Step 4: bottom right -->
  <rect x="640" y="300" width="500" height="140" rx="12" fill="rgba(0,196,100,0.10)" stroke="rgba(0,196,100,0.45)" stroke-width="1.5"/>
  <circle cx="684" cy="340" r="24" fill="#00C464"/>
  <text x="684" y="348" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="730" y="332" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="600" fill="#C8D8F0" text-anchor="start">Verify in Staging</text>
  <text x="730" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">Test your app</text>
  <text x="730" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#8899AA" text-anchor="start">after the import</text>
</svg>
